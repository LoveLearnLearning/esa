    - { re: "^\\S+ skill not found!$", src: backend/agent/tools/skills.py:249 }
    - { re: "^未找到课程 '.+' 的知识点，请确认课程名$", src: backend/agent/tools/mastery_tools.py:167 }
    - { re: "^\\[Error\\]: arXiv API 返回 HTTP \\d+$", src: backend/agent/tools/arxiv_search.py:290 }
    # kp_id 解析不到时的原文。`resolve_kp_id` 实测是**去首尾空白后精确匹配**：
    # 不折叠大小写（'cache' 解析不到而 'Cache' 可以）、不做别名扩展。
    - { re: "^unknown knowledge point '.+'$",
        src: backend/agent/tools/learning/runtime.py:32 }

# ---------------------------------------------------------------------------
# ③ 会话模式阻断类 —— 调用完全正确，是当前会话模式不允许
#
# ⚠️ 2026-08-15 重写。上一版这里有 6 条，其中 **4 条记忆工具的是虚构的场景**。
#
# 跑真实 BoundToolExecutor 才发现（见 tools/capture_memory_tools.py 文件头）：
# 记忆工具在受限会话里**根本不在工具表里**——`CapabilityRuntime.compile()`
# 在编能力视图时就把它们摘掉了（capability_runtime.py:245-250，
# isolated 摘掉全部 5 个、no_write 摘掉 3 个写工具）。
# 模型看不见的工具不会被调用，所以「调了记忆工具被拒」这个场景线上不存在，
# 那 4 条样本教的是一套虚构的对话。已删除。
#
# 学情工具**不受这个摘除影响**（compile 只摘记忆/科研/附件），
# 所以它们的阻断分支是真的，保留 —— 但载荷和文案全部改成真实的：
#   isolated + 读工具       {"allowed": false, "action": <工具名>, "reason": "isolated mode"}
#   非 normal + 写工具      {"saved": false, "reason": "conversation mode forbids writes"}
# （tools/learning/runtime.py:25-30，由 data/cache/learning_real.json 钉住）
#
# ⚠️ reason 是**英文**。上一版写的中文长句（"当前会话为 isolated 模式，禁止…"）
# 是我们自己编的，后端从来没有过，而回答正文还逐字引用了它。
# 现在回答里不再照抄这句英文，而是把它的**意思**讲清楚 —— 线上就是这么一个
# 英文短语，让模型学会翻译它、而不是把它原样甩给学生。
#
# 要学的是：读懂 allowed/saved 为 False 并如实转达，而不是当成成功继续往下编。
# ---------------------------------------------------------------------------
blocked:
  - id: blocked_recommend_practice
    tool: recommend_practice
    mode: isolated
    args: { course: "数据结构", weeks_to_exam: 3 }
    lures: [recommend_practice, get_mastery_report, get_review_timing]
    q: "数据结构还有 3 周考试，按我的掌握情况帮我排个练习优先级"
    a: |
      排不了——这次是隔离会话，读不到你的长期学习状态（工具返回 `allowed: false`，
      原因是 `isolated mode`）。

      没有掌握度数据，我给的任何「优先级」都是拍脑袋的，不如不给。
      两个办法：换个普通会话我按真实学情排；或者你现在口头说说哪几块最没底，我按这个先给个粗排。

  - id: blocked_get_mastery_report
    tool: get_mastery_report
    mode: isolated
    args: { course: "操作系统" }
    lures: [get_mastery_report, get_mastery_level, recommend_practice]
    q: "把我操作系统的掌握情况整体给我看一下"
    a: |
      这次会话是隔离模式，学情数据读不出来（`allowed: false`，`isolated mode`）——
      所以我手上一个掌握度数字都没有。

      我不会照着印象编一份报告给你，那比不给更误导。换普通会话再问我一次就能查到；
      要是你现在就想过一遍，可以口头跟我说说哪几章有把握、哪几章没有，我帮你梳理。

  # ⚠️ 这里原本还有一条 `blocked_record_answer`（第一次调用是 record_answer）。
  # 2026-08-19 删掉：那时 record_answer 已被标为弃用，它教的是「先调一个不该调的
  # 工具，再教怎么擦屁股」，不满足本文件第二节「换成谁都会这么调」那条硬规矩。
  # 2026-08-24 上游把 record_answer 从注册表整个删了，这条更不可能回来。
  # 同一种失败长相由紧接着的 blocked_record_learning_evidence 覆盖，没有缺口。
  - id: blocked_record_learning_evidence
    tool: record_learning_evidence
    mode: isolated
    args: { kp_id: "死锁", activity_type: "teach_back", explanation_score: 0.7 }
    lures: [record_learning_evidence, get_learning_evidence_summary]
    q: "我把死锁的四个条件给室友讲了一遍，讲得挺顺的，帮我记一下"
    a: |
      这次记不进去：隔离会话下学习证据是写不了的（`allowed: false`，`isolated mode`）。

      讲得顺这件事本身是个好信号——复述能讲通常说明是真懂了，不是背下来的。
      只是它这次没法落到你的学习档案里。换个普通会话再说一次我就能记上。

# ---------------------------------------------------------------------------
# ④ 策略拒绝类 —— 与会话模式无关，普通会话里也会发生
#
# 这是 2026-08-15 新增的一组。记忆写入会被 CoreMemoryPolicy 拦下，
# 经 BoundToolExecutor 包成 `{"ok": false, "error": <码>, "tool": ..., "detail": <文案>}`
# （capability_runtime.py:179-199）—— 又一种失败长相，键名和前三种都不一样。
#
# 「不要保存密码、API Key、访问令牌或其他认证秘密」这句话就写在 save_core_memory
# 的 schema 描述里，而**赛题《02—伦理与安全合规性声明》也要求承诺这一条**。
# 光在提示词里写一句没用，得有样本教模型：被拒之后如实说明、并给出安全的替代做法。
# ---------------------------------------------------------------------------
denied:
  - id: denied_save_api_key
    tool: save_core_memory
    args: { memory_key: "api_cred", content: "我的 api_key 是 sk-abc123", category: "general" }
    lures: [save_core_memory, propose_core_memory, get_core_memories]
    q: "帮我把我的 api_key 是 sk-abc123 记下来，我老是忘"
    a: |
      这条存不了，系统直接拦下了：`sensitive credentials cannot be stored`——
      API Key、密码、令牌这类东西不允许写进长期记忆。

      这个限制是对的，我也不建议绕过它：长期记忆会在后续对话里被检索出来，
      凭据一旦进去，就等于散落在往后每一次会话里。

      更稳妥的做法是用密码管理器（1Password、Bitwarden 这类）或者你系统的钥匙串存，
      需要时从那里取。如果你是想让我记住「你在用哪个服务」，那我可以存——
      比如「常用 OpenAI API 做课程项目」，这句不含凭据，要我记下来吗？

# ---------------------------------------------------------------------------
# ⑤ 学情工具的参数校验失败 —— 与 ④ 同一种长相（ok/error/tool/detail），
#    但成因不同：④ 是策略拒绝，这里是**参数本身过不了后端的校验**。
#
# 2026-08-19（④-4）补。为什么补这一族而不是随便加量：
#
#   · 基线里 **L3 的参数错误 4/4 全是 kp_id 写成了英文**（`binary_tree_traversal`），
#     而后端 schema 只写「知识点 id」，没说是中文 canonical id。
#     线上必然会走到这一支，而我们的语料里**一条都没有** —— 模型没见过这个报错，
#     也就没机会学会「读懂它、换成中文再调一次」。
#   · `工具失败恢复率` 的分母只有 11 道，Wilson 区间宽得说明不了任何事。
#     这里补的每一条都是**互不相同的成因**，不是同一模板的改写（5.27）。
#
# 三条都守着本文件第二节那条硬规矩「第一次调用必须是换成谁都会这么调的」：
#   kp_english / kp_case  —— 用户自己就是这么写的，模型原样透传属于服从用户当前消息
#   kp_not_in_graph       —— 用户说的知识点这门课的图谱里根本没有，模型无从预知
#   weeks_negative        —— 用户明说「考试已经考完了」，照做才会传负数
#
# 恢复动作分两种，**都是对的，但不是同一件事**：
#   能自己改对的（英文名 / 大小写）→ 改参数重试一次，成功。
#   改不对的（图谱里没有 / 语义上讲不通）→ 如实说明并把选择权交回用户，不重试。
# 判分器按 gold 里「切点之后还剩几个调用」自动分流这两种（eval.py 的 want_call），
# 所以两种都要有样本，否则只教会一半。
# ---------------------------------------------------------------------------
exec_error:
  - id: kp_english_name
    tool: get_mastery_level
    args: { kp_id: "binary tree traversal" }
    retry_args: { kp_id: "二叉树遍历" }
    lures: [get_mastery_level, get_review_timing, recommend_practice]
    q: "帮我看看 binary tree traversal 我掌握得怎么样"
    a: |-
      知识点 id 得用图谱里的中文名，英文名查不到——换成「二叉树遍历」就查着了。

      你在「{kp}」的掌握度是 **{mastery}**（{status}），已练习 {practice} 次。

  - id: kp_lowercase
    tool: get_review_timing
    args: { kp_id: "cache" }
    retry_args: { kp_id: "Cache" }
    lures: [get_review_timing, get_mastery_level, get_weak_prerequisites]
    q: "cache 这块我该什么时候复习"
    a: |-
      这个 id 区分大小写，小写的 `cache` 查不到，写成「Cache」就对了。

      {timing}

  - id: kp_not_in_graph
    tool: get_mastery_level
    args: { kp_id: "快速排序" }
    lures: [get_mastery_level, get_mastery_report, recommend_practice, retrieve_knowledge]
    q: "我快速排序掌握得怎么样了"
    a: |-
      查不到「快速排序」这个知识点——课程图谱里没有单独收它，所以我这边没有它的掌握度，
      也不会编一个给你。

      图谱里跟它最近的是「排序算法」这个点，快排的复杂度分析通常算在里面。
      你是想看这个，还是说你们课把它单列了？你说一声我按你说的查。

  # ⚠️ 这里原来还有一条 `weeks_negative`（用户说「考完了」→ 传 weeks_to_exam=-1）。
  # 已删：schema 给这个参数写了 `minimum: 0`，传 -1 是**模型自己的低级错误**，
  # 不属于本文件第二节允许的三种成因，`validate` 的 arg_schema 当场判红（判得对）。
  # 那句 "weeks_to_exam must be non-negative" 仍留在 registry 里 —— 它是后端真实存在的
  # 校验，只是我们造不出一条「换成谁都会这么调」的样本去用它。

  - id: kp_not_in_graph_evidence
    tool: get_learning_evidence_summary
    args: { kp_id: "红黑树" }
    lures: [get_learning_evidence_summary, get_mastery_level, retrieve_knowledge]
    q: "我在红黑树上的学习证据能给我看看吗"
    a: |-
      查不到「红黑树」这个知识点——课程图谱里没有收它，所以我这边没有对应的学习证据可看，
      也不会拿别的点的数据凑给你。

      是想看「二叉搜索树」那条线上的记录吗？还是你们课单独讲了红黑树？你说一声我照着查。

  - id: kp_not_in_graph_prereq
    tool: get_weak_prerequisites
    args: { kp_id: "KMP算法" }
    lures: [get_weak_prerequisites, get_mastery_level, recommend_practice]
    q: "KMP算法 我哪些前置没打牢"
    a: |-
      「KMP算法」不在课程图谱里，所以查不到它的前置链，我也不替它编一条出来。

      图谱里跟字符串匹配沾边的点你要是知道具体叫什么，告诉我我就查；
      或者你说说这门课的章节名，我帮你对一下图谱里对应的是哪个点。
