# 话术种子库：用户会怎么问
#
# 这个文件解决的是「变量池撑不起预算」的问题。设计总表里 ST004 预算 100 条，
# 但变量只有 course(2) × weeks(2) = 4 种组合，等于同一个决策重复 25 遍。
# 有效组合数 = ∏(事实变量取值数) × 话术种子数，话术这一维必须补上来。
#
# 多样性维度（不是换个词，是换说法）：
#   口语随意 / 正式书面 / 带情绪 / 省略主语 / 有错别字 / 长句带背景 / 追加条件 / 反问
#
# 占位符：{course} {weeks} {kp} {memory_key} —— 由生成器按 State 的变量组合填充。
# 每个 state_key 对应设计总表里某个 State 的参数状态，不是 State 本身，
# 这样表里剪枝之后种子库不用跟着改。

# ---------------------------------------------------------------------------
S002:
  name: 制定课程练习计划
  tool: recommend_practice
  facts:
    course: [数据结构, 操作系统, 计算机网络, 计算机组成原理, 数据库原理, 算法设计与分析]
    weeks_to_exam: [0, 1, 2, 3, 4, 6, 8, 12, 16]

  phrasings:
    # course + weeks_to_exam 都在当前轮 → CALL_TOOL
    参数齐全:
      - "{course}还有{weeks}周考试，今天该练什么？"
      - "距离{course}期末还有{weeks}周，帮我排一下练习重点"
      - "请针对{course}课程制定练习计划，考试在{weeks}周后。"
      - "{course}，{weeks}周后考，给我推荐点题"
      - "我{weeks}周后考{course}，现在开始刷题还来得及吗，从哪儿下手"
      - "还有{weeks}个星期就考{course}了，我该重点练哪些知识点啊"
      - "帮忙看下{course}怎么复习，考试时间是{weeks}周以后"
      - "{course}期末{weeks}周后开考，平时分拿满了想冲卷面，安排下练习重点"
      - "{weeks}周后{course}考试，救救孩子，该刷什么"
      - "老师说{course}{weeks}周后考，帮我看看优先练哪块"
      - "想问下{course}的复习顺序，{weeks}周时间够吗"
      - "{course}还有{weeks}周，我想按重要程度排个练习清单"
      - "帮我看下数据结够这门课……啊不是，{course}，{weeks}周后考试，练什么好"
      - "我们{course}期末在{weeks}周之后，能不能给个刷题优先级"
      - "{course}考试倒计时{weeks}周，给我列几个必练的知识点"
      - "{weeks}周备考{course}，时间紧，只练最关键的那几个就行"

    # 缺 weeks_to_exam → ASK_USER
    缺weeks:
      - "帮我制定一下{course}的刷题计划"
      - "{course}该练什么？"
      - "我想复习{course}，给我推荐点重点"
      - "请为{course}课程生成练习建议。"
      - "{course}我学得不太好，想刷题，从哪开始"
      - "给我安排下{course}的练习吧"
      - "{course}有哪些知识点是必须练的"
      - "最近想突击一下{course}，你给点建议"
      - "帮我看看{course}怎么练比较有效率"
      - "{course}的题好多啊，我该先做哪部分"
      - "想问下{course}的复习重点在哪"
      - "老师让我们自己刷{course}，我不知道练啥"
      - "能不能给我出个{course}的练习计划"
      - "{course}这门课，帮我排个练习顺序"

    # 缺 course → ASK_USER
    缺course:
      - "还有{weeks}周考试了，给我推荐点题练练"
      - "{weeks}周后考试，我该刷什么"
      - "距离考试还有{weeks}周，帮我制定练习计划"
      - "我{weeks}周后要考试了，现在练什么来得及"
      - "考试{weeks}周后，给我列个重点"
      - "还剩{weeks}个星期，帮我安排下刷题"
      - "{weeks}周时间，够我突击完吗，练什么好"
      - "马上{weeks}周后考试了，推荐几个知识点吧"

    # 两个都缺 → ASK_USER
    都缺:
      - "我想刷题，给我推荐一下"
      - "帮我制定个练习计划"
      - "今天练什么好"
      - "给我推荐点题吧"
      - "我要复习了，从哪开始"
      - "帮我看看该练什么知识点"
      - "想刷点题，有什么建议吗"
      - "给我安排一下学习任务"
      - "最近想认真学一下，你给我排排"
      - "帮我看看接下来练什么比较好"
      - "我该刷哪些题啊"
      - "能给我出个复习安排吗"
      - "想提高一下，从哪个知识点开始"
      - "帮我规划下练习内容吧"
      - "有什么推荐练的吗"

    # 参数在历史轮，当前轮只是追问 → CALL_TOOL，不得重复询问
    参数在历史轮:
      - "那现在该练什么？"
      - "好，那给我排个计划吧"
      - "嗯，那你觉得我先练哪个"
      - "行，那按这个来，推荐几个知识点"
      - "明白了，接下来练什么"
      - "那帮我把练习重点列一下"

    # 用户修改了先前给的参数 → CALL_TOOL，且必须用**最新**值。
    # 按被修改的字段分组：{course}/{weeks} 是新值，{old_course}/{old_weeks} 是被覆盖的旧值。
    # 这个状态就是用来教 R005 的，工具参数一旦用了旧值就等于教反了。
    # ⚠️ 每条改口话术**必须同时带上课程和周数**，哪怕只改了其中一个。
    # 原来改周数的话术只写周数（「等等，不是 8 周，是 3 周后就考」），
    # 于是不同课程的样本渲染出完全相同的句子 —— template_id 不相交，原句却一模一样，
    # 训练集和评测集里同一句话各出现一次，而这句话**本身就带着答案**。
    # 这种字面泄漏 `template_id` 整组切分拦不住，evalset 的 assert_no_train_overlap 才能拦。
    修改参数:
      weeks_to_exam:
        - "等等，{course}不是{old_weeks}周，是{weeks}周后就考"
        - "说错了，{course}的考试时间是{weeks}周后，不是{old_weeks}周"
        - "更正一下，{course}还有{weeks}周，我刚才记错成{old_weeks}周了"
        - "哦不对，{course}是{weeks}周后考，我看错课表了"
        - "抱歉，{course}那门改成{weeks}周吧"
      course:
        - "改一下，我要问的是{course}，不是{old_course}，还有{weeks}周考"
        - "抱歉说错了，课程是{course}，考试在{weeks}周后"
        - "等下，我想问的其实是{course}，{weeks}周后考试"
        - "不好意思打错了，换成{course}，还有{weeks}周"

  # 追问话术（ASK_USER 时助手怎么问）
  ask_templates:
    weeks_to_exam:
      - "好的。请问{course}的期末考试还有几周？知道时间我才能按紧急程度排优先级。"
      - "没问题。距离{course}考试还有多长时间呢？剩几周直接决定了是全面复习还是重点突破。"
      - "可以。你{course}的考试大概在几周后？时间不同，练习的取舍会差很多。"
      - "先确认一下：{course}还有几周考试？我需要这个来判断该铺开练还是抓重点。"
    course:
      - "好的。你想针对哪门课程制定计划？比如数据结构、操作系统、计算机网络这些。"
      - "没问题。请问是哪门课？不同课程的知识点权重不一样，我需要先确定范围。"
      - "可以。这次是要复习哪一门呢？"
    course_and_weeks:
      - "好的，我需要两个信息：一是哪门课程，二是距离考试还有几周。有了这两个才能排出优先级。"
      - "可以帮你排。不过得先知道：复习哪门课？考试在几周后？"
      - "没问题。请告诉我课程名和距离考试的周数，我再给你列练习重点。"

# ---------------------------------------------------------------------------
S003:
  name: 查询掌握度报告
  tool: get_mastery_report
  facts:
    course: [数据结构, 操作系统, 计算机网络, 计算机组成原理, 数据库原理, 算法设计与分析]

  phrasings:
    # course 是 optional，缺了也直接调 → CALL_TOOL（防止把 optional 当 required）
    指定课程:
      - "我{course}学得怎么样了？"
      - "看下我{course}的掌握情况"
      - "请查询我在{course}课程的学习进度。"
      - "{course}我现在什么水平"
      - "帮我看看{course}还有哪些知识点没掌握"
      - "我想知道{course}的学情报告"
      - "{course}这门课我掌握度多少了"
      - "查一下{course}，哪些点最薄弱"
    不指定课程:
      - "我最近学得怎么样？"
      - "看下我的学习情况"
      - "帮我查一下学情"
      - "我现在整体掌握度如何"
      - "请生成我的学习进度报告。"
      - "我这段时间进步了吗"
      - "哪些知识点我还比较弱？"
      - "给我看看我的学习数据"
      - "有多久没练的知识点吗"
      - "我全部课程的掌握情况怎么样"
      - "帮我做个学情分析吧"
      - "我哪块最拉胯"
      - "查一下我的进度"
      - "想知道自己现在什么水平"
      - "有哪些点是我一直没搞定的"
      - "请汇总一下我的各科掌握度。"
      - "我最近是不是有点荒废了"
      - "看看我还有哪些短板"
      - "帮我复盘一下学习情况"
      - "我的薄弱环节在哪"
      - "统计一下我的练习情况"
      - "给我一份学习总结"

# ---------------------------------------------------------------------------
S004:
  name: 记忆管理（gate 类）
  tool: delete_core_memory / save_core_memory
  facts:
    memory_key: [learning_goal, response_style, weak_topics, exam_schedule, major_info]

  phrasings:
    # gate 已满足：用户明确要求 → CALL_TOOL
    明确要求删除:
      - "把我之前设的学习目标删掉吧"
      - "忘掉你记的我的回答风格偏好"
      - "请删除关于我薄弱知识点的那条记忆。"
      - "我不想让你再记着我的考试安排了，删了它"
      - "之前存的那个学习目标不作数了，清掉"
      - "帮我把回答风格那条记忆去掉"
    明确要求记住:
      - "记一下，我是软件工程大三的，准备考研"
      - "请记住：我更喜欢先看直观例子，再看公式推导。"
      - "帮我存个学习目标——这学期把数据结构和算法吃透"
      - "以后回答简短一点，记住这个偏好"
      - "记下来，我的期末考试从第 16 周开始"

    # gate 未满足：只是提到，没有明确指令 → DIRECT_ANSWER，不得动记忆。
    # 这是全数据集里最重要的一批负样本 —— 状态修改类工具一旦误触发，
    # 用户的长期记忆会被悄悄改写，是不可逆的错误。
    仅提及未要求:
      - "我之前好像跟你说过我的学习目标？"
      - "你还记得我喜欢什么讲解方式吗"
      - "我这学期目标定得有点高了"
      - "感觉我之前设的那个目标不太现实"
      - "你之前记的那些东西还在吗"
      - "我今天状态不太好，学不进去"
      - "我可能不太适合考研这条路"
      - "上次说的那个复习计划，我没怎么执行"
      - "我记得我跟你提过我的专业方向"
      - "之前那个目标现在看有点离谱"
      - "唉，最近学习效率好低"
      - "我好像和你说过我是大三的"
      - "那个学习目标我都快忘了是啥了"
      - "我是不是给你说过我的考试时间"
      - "感觉最近状态一般般"
      - "我之前的偏好设置是什么来着"
      - "这学期计划有点赶不上变化"
      - "我可能要调整一下方向了"
      - "你对我了解多少啊"
      - "我之前说过想冲一下绩点"
      - "最近有点想摆烂了"
      - "我记性不太好，之前定了什么目标"
      - "感觉自己啥也没学会"
      - "上次那个安排太满了，有点吃不消"
      - "我是不是跟你聊过我的薄弱科目"
      - "现在想想当初的规划有点理想化"
      - "这几天没怎么学，有点心虚"
      - "我的学习习惯你应该有印象吧"
      - "之前那些设定还有用吗"
      - "我可能得重新想想学习方向"
      - "最近课太多了，顾不过来"
      - "感觉我之前立的 flag 都倒了"
      - "你那边存了我哪些信息呀"
      - "我好像提过我更喜欢看例子"
      - "这学期过半了，感觉没什么进展"

  ask_templates:
    memory_key:
      - "可以帮你删。请问要删掉哪一条？你目前保存的有学习目标、回答风格偏好这些。"
      - "好的，不过得先确认删哪条记忆——能说下具体是哪一项吗？"
  refuse_templates:
    # gate 未满足时的回应：不动记忆，但要接住用户的话
    - "你之前设的目标我这边还留着。要调整或者删掉的话跟我说一声，我不会自己动它。"
    - "记忆我保留着没变。如果想改或者清掉，明确告诉我一声就行。"
    - "目标定高一点不是坏事，关键是拆得够细。要不要一起看看怎么分阶段？需要我改动记录的话你说。"

# ---------------------------------------------------------------------------
# S001 天气：设计总表里作为「贯穿示例」存在，但它不是教育场景。
# 建议 v1 只保留少量样本用于验证「缺参数追问」这条规律的跨场景泛化（L3 场景外推），
# 不投入预算做深。
S001:
  name: 查询城市天气（仅作规律泛化的对照场景）
  tool: get_weather
  facts:
    city: [北京, 上海, 广州, 深圳, 成都, 杭州, 武汉, 西安]
  phrasings:
    参数齐全:
      - "{city}今天天气怎么样"
      - "查一下{city}的天气"
      - "请告诉我{city}当前的天气情况。"
      - "{city}现在冷不冷"
    缺city:
      - "今天天气怎么样"
      - "外面冷吗"
      - "查下天气"
      - "今天用带伞吗"
    参数在历史轮:
      - "那明天呢"
      - "现在温度多少"
  ask_templates:
    city:
      - "你想查哪个城市的天气？"
      - "请问要查询哪座城市呢？"
