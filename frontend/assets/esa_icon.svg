        stroke-linejoin="round"/>

  <!-- Terminal nodes reinforce the knowledge-graph / memory-link motif -->
  <circle cx="658" cy="292" r="46" fill="#2563EB"/>
  <circle cx="658" cy="732" r="46" fill="#2563EB"/>

  <!-- '星' / intelligence spark: the middle E arm resolves into a star -->
