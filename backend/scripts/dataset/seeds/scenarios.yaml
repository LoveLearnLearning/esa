# 话术种子库：用户会怎么问
#
# 这个文件解决的是「变量池撑不起预算」的问题。设计总表里 ST004 预算 100 条，
# 但变量只有 course(2) × weeks(2) = 4 种组合，等于同一个决策重复 25 遍。
# 有效组合数 = ∏(事实变量取值数) × 话术种子数，话术这一维必须补上来。
#
# 多样性维度（不是换个词，是换说法）：
#   口语随意 / 正式书面 / 带情绪 / 省略主语 / 有错别字 / 长句带背景 / 追加条件 / 反问
#
# 占位符：{course} {weeks} {kp} {memory_key} —— 由生成器按 State 的变量组合填充。
# 每个 state_key 对应设计总表里某个 State 的参数状态，不是 State 本身，
# 这样表里剪枝之后种子库不用跟着改。

# ---------------------------------------------------------------------------
S002:
  name: 制定课程练习计划
  tool: recommend_practice
  facts:
    course: [数据结构, 操作系统, 计算机网络, 计算机组成原理, 数据库原理, 算法设计与分析]
    weeks_to_exam: [0, 1, 2, 3, 4, 6, 8, 12, 16]

  phrasings:
    # course + weeks_to_exam 都在当前轮 → CALL_TOOL
    参数齐全:
      - "{course}还有{weeks}周考试，今天该练什么？"
      - "距离{course}期末还有{weeks}周，帮我排一下练习重点"
      - "请针对{course}课程制定练习计划，考试在{weeks}周后。"
      - "{course}，{weeks}周后考，给我推荐点题"
      - "我{weeks}周后考{course}，现在开始刷题还来得及吗，从哪儿下手"
      - "还有{weeks}个星期就考{course}了，我该重点练哪些知识点啊"
      - "帮忙看下{course}怎么复习，考试时间是{weeks}周以后"
      - "{course}期末{weeks}周后开考，平时分拿满了想冲卷面，安排下练习重点"
      - "{weeks}周后{course}考试，救救孩子，该刷什么"
      - "老师说{course}{weeks}周后考，帮我看看优先练哪块"
      - "想问下{course}的复习顺序，{weeks}周时间够吗"
      - "{course}还有{weeks}周，我想按重要程度排个练习清单"
      - "帮我看下数据结够这门课……啊不是，{course}，{weeks}周后考试，练什么好"
      - "我们{course}期末在{weeks}周之后，能不能给个刷题优先级"
      - "{course}考试倒计时{weeks}周，给我列几个必练的知识点"
      - "{weeks}周备考{course}，时间紧，只练最关键的那几个就行"

    # 缺 weeks_to_exam → ASK_USER
    缺weeks:
      - "帮我制定一下{course}的刷题计划"
      - "{course}该练什么？"
      - "我想复习{course}，给我推荐点重点"
      - "请为{course}课程生成练习建议。"
      - "{course}我学得不太好，想刷题，从哪开始"
      - "给我安排下{course}的练习吧"
      - "{course}有哪些知识点是必须练的"
      - "最近想突击一下{course}，你给点建议"
      - "帮我看看{course}怎么练比较有效率"
      - "{course}的题好多啊，我该先做哪部分"
      - "想问下{course}的复习重点在哪"
      - "老师让我们自己刷{course}，我不知道练啥"
      - "能不能给我出个{course}的练习计划"
      - "{course}这门课，帮我排个练习顺序"
      - "{course}我想系统练一遍，帮我挑几个值得优先投入的知识点"

    # 缺 course → ASK_USER
    缺course:
      - "还有{weeks}周考试了，给我推荐点题练练"
      - "{weeks}周后考试，我该刷什么"
      - "距离考试还有{weeks}周，帮我制定练习计划"
      - "我{weeks}周后要考试了，现在练什么来得及"
      - "考试{weeks}周后，给我列个重点"
      - "还剩{weeks}个星期，帮我安排下刷题"
      - "{weeks}周时间，够我突击完吗，练什么好"
      - "马上{weeks}周后考试了，推荐几个知识点吧"

    # 两个都缺 → ASK_USER
    都缺:
      - "我想刷题，给我推荐一下"
      - "帮我制定个练习计划"
      - "今天练什么好"
      - "给我推荐点题吧"
      - "我要复习了，从哪开始"
      - "帮我看看该练什么知识点"
      - "想刷点题，有什么建议吗"
      - "给我安排一下学习任务"
      - "最近想认真学一下，你给我排排"
      - "帮我看看接下来练什么比较好"
      - "我该刷哪些题啊"
      - "能给我出个复习安排吗"
      - "想提高一下，从哪个知识点开始"
      - "帮我规划下练习内容吧"
      - "有什么推荐练的吗"
      # ↓ 2026-08-12 补。这一桶不带任何占位符，一条话术只渲染一条样本，
      #   所以缺多少条样本就得写多少条话术。
      #   写的时候盯住一件事：这一桶问的是「该练什么」（recommend_practice），
      #   不是「我学得怎么样」（get_mastery_report，那是 S003.不指定课程）。
      #   两者混了就等于教模型把这两个工具随机二选一。
      - "请为我生成一份练习任务清单。"
      - "有点不知道从哪下手，你帮我定个练习方向吧"
      - "练啥？"
      - "今晚有两个小时，拿来刷题的话练什么划算"
      - "我是不是该先把基础题过一遍再说？你给个建议"
      - "帮我安排点习题呗"
      - "想找点题做，最好是能补短板的那种"
      - "麻烦推荐一下接下来的练习内容。"
      - "我练习计化该怎么定啊"
      - "这几天挺闲的，想多刷点题，你说练哪些比较值"
      - "给我派点任务吧，我照着做"
      - "不知道练什么，随便给我推几个知识点也行"
      - "能否帮我拟定一个阶段性的练习安排？"
      - "我想把弱的地方补一补，该从哪些题入手"
      - "最近效率低，想靠刷题找回状态，练什么好"
      - "帮我列个练习清单吧，越具体越好"
      - "有推荐的练习顺序吗"
      - "我该按什么顺序刷题呢"
      - "求个刷题路线"
      - "想问下接下来重点练哪几块比较合适"
      - "请推荐适合我当前水平的练习内容。"
      - "我打算每天固定练一小时，你帮我定内容"
      - "练习方向给个建议行吗"
      - "帮我看看优先级，先练哪些后练哪些"
      - "我想开始刷题了，你说从哪块切入"
      - "有没有那种性价比高的练习推荐"
      - "往后这段时间的练习，你帮我定个大方向"
      - "我要是想提分，应该重点练什么"
      - "我想知道现在最该练的是哪几个知识点"
      - "帮我把练习任务拆一拆，我不知道怎么分配"

    # 参数在历史轮，当前轮只是追问 → CALL_TOOL，不得重复询问
    参数在历史轮:
      - "那现在该练什么？"
      - "好，那给我排个计划吧"
      - "嗯，那你觉得我先练哪个"
      - "行，那按这个来，推荐几个知识点"
      - "明白了，接下来练什么"
      - "那帮我把练习重点列一下"

    # 用户修改了先前给的参数 → CALL_TOOL，且必须用**最新**值。
    # 按被修改的字段分组：{course}/{weeks} 是新值，{old_course}/{old_weeks} 是被覆盖的旧值。
    # 这个状态就是用来教 R005 的，工具参数一旦用了旧值就等于教反了。
    # ⚠️ 每条改口话术**必须同时带上课程和周数**，哪怕只改了其中一个。
    # 原来改周数的话术只写周数（「等等，不是 8 周，是 3 周后就考」），
    # 于是不同课程的样本渲染出完全相同的句子 —— template_id 不相交，原句却一模一样，
    # 训练集和评测集里同一句话各出现一次，而这句话**本身就带着答案**。
    # 这种字面泄漏 `template_id` 整组切分拦不住，evalset 的 assert_no_train_overlap 才能拦。
    修改参数:
      weeks_to_exam:
        - "等等，{course}不是{old_weeks}周，是{weeks}周后就考"
        - "说错了，{course}的考试时间是{weeks}周后，不是{old_weeks}周"
        - "更正一下，{course}还有{weeks}周，我刚才记错成{old_weeks}周了"
        - "哦不对，{course}是{weeks}周后考，我看错课表了"
        - "抱歉，{course}那门改成{weeks}周吧"
      course:
        - "改一下，我要问的是{course}，不是{old_course}，还有{weeks}周考"
        - "抱歉说错了，课程是{course}，考试在{weeks}周后"
        - "等下，我想问的其实是{course}，{weeks}周后考试"
        - "不好意思打错了，换成{course}，还有{weeks}周"

  # 追问话术（ASK_USER 时助手怎么问）
  ask_templates:
    weeks_to_exam:
      - "好的。请问{course}的期末考试还有几周？知道时间我才能按紧急程度排优先级。"
      - "没问题。距离{course}考试还有多长时间呢？剩几周直接决定了是全面复习还是重点突破。"
      - "可以。你{course}的考试大概在几周后？时间不同，练习的取舍会差很多。"
      - "先确认一下：{course}还有几周考试？我需要这个来判断该铺开练还是抓重点。"
    course:
      - "好的。你想针对哪门课程制定计划？比如数据结构、操作系统、计算机网络这些。"
      - "没问题。请问是哪门课？不同课程的知识点权重不一样，我需要先确定范围。"
      - "可以。这次是要复习哪一门呢？"
    course_and_weeks:
      - "好的，我需要两个信息：一是哪门课程，二是距离考试还有几周。有了这两个才能排出优先级。"
      - "可以帮你排。不过得先知道：复习哪门课？考试在几周后？"
      - "没问题。请告诉我课程名和距离考试的周数，我再给你列练习重点。"

