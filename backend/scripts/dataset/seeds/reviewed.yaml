# 人工复核台账：**已经有人真的看过并认可**的样本。
#
# 为什么需要它
# ------------
# `needs_review` 是在生成器里按组写死的（`gen_calculators.py` 的 hard_negatives、
# `gen_negatives.py` 的 traps、`gen_skills_rag.py` 的 load_skill 正例……）。
# 想放行其中一条，以前只能去改生成器代码，而且是**整组一起放行** —— 审完一条
# 却必须连带放行同组另外十几条没审的，等于把闸门直接拆了。
#
# 这张表把粒度改成逐条：在这里登记一个 id，它就从待复核队列里消失、回到训练集。
# 没登记的照旧挡在训练集外面。
#
# 规矩
# ----
#   - **只有人能往这里写。** 生成器不写、脚本不写。这张表就是"有人负责"这件事本身。
#   - `by` 写真名，不写"已审"。出了事要能找到人问，这是这张表存在的全部意义。
#   - `note` 写你**看了什么**，不是"没问题"。「核对了推导每一步」和「扫了一眼」
#     是两回事，后来的人需要知道是哪一种。
#   - 样本内容改过之后，这条登记就作废了 —— 删掉重审。台账认的是"这个 id 当时那版
#     内容有人看过"，不是"这个 id 永久免检"。
#   - 登记一个不存在的 id 会**直接报错**，不会静默忽略（`esa/review.py`）。
#     样本改名或删除之后，这里的残留条目必须清掉。
#
# 用法
# ----
#     python3 dataset/tools/export_review_queue.py   # 队列里只剩没登记的
#     PYTHONPATH=dataset python3 -m esa.evalset      # 已登记的自动回到训练集
#
# 格式
# ----
#     reviewed:
#       - id: trap_000
#         by: 张三
#         date: 2026-08-12
#         note: 逐步核对了平均情况递推式；确认没有把最好情况当平均情况

# 2026-08-12 这批：仓库 owner 授权 Claude 代审 56 条。
# 放行 53 条；notool_推理与判断_01 已改种子重生成（术语不准）；
# trap_012 / trap_013 未放行 —— 需要产品拍板，理由见交接文档「待更新提醒」。
#
# ⚠️ by 为什么写 GitHub handle 而不是真名
# ------------------------------------
# 上面「规矩」那条要求 by 写真名，但 `tools/make_publish_dir.py` 的泄漏扫描
# **禁止任何队友真名进入发布产物**（PATTERNS 第 107 行）。这张表在
# `backend/scripts/dataset/seeds/` 里是要发上游的 —— 两条规矩直接打架。
# 这个冲突以前没暴露，因为台账一直是 `reviewed: []`，这是它第一次有内容。
#
# 折中：写 GitHub handle。它本来就公开在提交记录里，既满足「出了事能找到人问」，
# 又不会把真名发出去。**若哪天由真人重签，也请用 handle，别用真名。**
#
# by 一律写成 "Claude（授权：<handle>）"：如实记录是谁看的、谁授权的。
# 不写成人名，是因为这 53 条确实不是人逐条看的 —— 台账不替任何人背书。

