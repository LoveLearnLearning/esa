        content: "以保研为目标，优先保绩点"
        category: project
      - q: "我住宿舍，晚上十一点断网"
        memory_key: study_constraint
        content: "住宿舍，晚上十一点断网"
        category: constraint
      - q: "我做题喜欢先自己憋一会儿，不想马上看答案"
        memory_key: problem_solving_style
