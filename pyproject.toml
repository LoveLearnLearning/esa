[tool.pytest.ini_options]
testpaths = [
    "backend/tests",
    "backend/agent/DocIR/tests",
    "backend/agent/rag/tests",
    "backend/agent/rag/chunk/tests",
]
addopts = "-ra --strict-markers --tb=short -p no:cacheprovider"

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["documents"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = [
    "backend/agent/memories/memory_models.py",
    "backend/core/stores/sqlite_connection.py",
    "backend/core/stores/migrations.py",
    "backend/core/web/concurrency.py",
    "backend/core/utils/models.py",
]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
