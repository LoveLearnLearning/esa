  - id: rag_service_not_configured
    raises: RuntimeError      # 抛的异常类型；闸门拿 classify_tool_exception 核
    error_code: temporary_tool_error
    tool: retrieve_knowledge
    args: { query: "红黑树的删除操作", top_k: 5 }
    err: "RAG retrieval service is not configured; configure it during the ESA application lifespan"
    src: backend/agent/rag/agent_api.py:41-44
    lures: [retrieve_knowledge, get_knowledge_base_stats, load_skill]
    # 2026-08-22：措辞改成**明确限定公共库**。上游把 retrieve_knowledge 从「默认」
    # 降成了「用户明确指定公共库，或个人库无结果时才调」，默认位置让给了
    # retrieve_federated_knowledge。原话「从知识库里查」在新语义下是含糊的，
    # 照旧会教模型把公共库当默认。
    q: "只查课程公共资料，红黑树删除操作的完整步骤是什么"
    a: |
      知识库这次没查成，所以我拿不到你们课程资料里的原文。

      我可以按通用教材讲一遍红黑树删除（双黑节点的四种情况怎么调），但要注意：**这不是你们课件里的版本**，
      符号和步骤划分可能不一样，考试以课件为准。要不要我先讲通用版？

  - id: rag_threshold_out_of_range
    raises: ValueError      # 抛的异常类型；闸门拿 classify_tool_exception 核
    error_code: invalid_tool_arguments
    tool: retrieve_knowledge
    args: { query: "TCP 拥塞控制", top_k: 5, similarity_threshold: 1.5 }
    err: "similarity_threshold must be between 0 and 1"
    src: backend/agent/rag/agent_api.py:57-58
    lures: [retrieve_knowledge, get_knowledge_base_stats]
    q: "查一下知识库里 TCP 拥塞控制的内容，相似度阈值给我调到 1.5，我只要最准的"
    a: |
      我把 similarity_threshold 传成了 1.5，工具没接受——这个参数是 0 到 1 之间的相似度，
      不是倍数，是我写错了。

      顺带说一句，调高阈值不等于「更准」，只是把低于线的结果全丢掉，很容易一条都不剩。
      我建议先不设阈值检索一次，看看结果够不够聚焦，不够再收紧——要我这么做吗？

  - id: rag_threshold_needs_reranker
    raises: RuntimeError      # 抛的异常类型；闸门拿 classify_tool_exception 核
    error_code: temporary_tool_error
    tool: retrieve_knowledge
    args: { query: "死锁的四个必要条件", top_k: 5, similarity_threshold: 0.9 }
    err: "similarity_threshold requires an active reranker; RRF scores are rank-fusion scores, not probabilities"
    src: backend/agent/rag/agent_api.py:104-107
    lures: [retrieve_knowledge, get_knowledge_base_stats]
    q: "知识库里搜死锁的四个必要条件，阈值设 0.9 只要最相关的"
    a: |
      我给 similarity_threshold 传了 0.9，工具没接受，这条路先放一放。

      想达到「只要最相关的」，正确做法是把返回条数调小，而不是卡阈值。我改成只取前 2 条重新检索，行吗？

# ---------------------------------------------------------------------------
# ② error 键类 —— 三个计算器。失败源于用户自己给的表达式 / schema 没写清楚
#
# 观测值由 tools/capture_math_outputs.py 跑真实后端函数抓取，这里只写调用与话术。
# retry_args 非空表示这是「读懂报错 → 改对参数 → 重试成功」的多轮样本。
# ---------------------------------------------------------------------------
calculators:
  - id: calc_div_zero
    tool: calculator
    args: { expression: "1024/(10-10)" }
    src: backend/agent/tools/math_tools/_base_evaluator.py:63-64
    lures: [calculator, math_solver, bitwise_calculator]
    q: "帮我算一下 1024/(10-10)"
    a: |
      这个式子算不出来：分母 `10-10` 等于 0，计算器返回了「除零错误」。

      数学上除以零是没有定义的，不是「结果很大」也不是无穷大。你是不是括号里的数写错了？
      告诉我正确的分母我再算一遍。

  - id: calc_unknown_symbol
    tool: calculator
    args: { expression: "n*log(n)" }
    src: backend/agent/tools/math_tools/_base_evaluator.py:52-53
    lures: [calculator, math_solver]
    q: "算一下 n*log(n) 等于多少"
    a: |
      算不了，计算器报的是「未知的变量或常量: 'n'」——它只做数值计算，`n` 没有具体取值就无从算起。

      看你这个式子，多半是在估算复杂度。那有两条路：
      - 想要**具体数字**：告诉我 n 是多少，比如 n=1024 我就能算出来；
      - 想要**符号推导**：那该用符号计算，不是这个计算器。

      你要哪种？

  - id: calc_unknown_function
    tool: calculator
    args: { expression: "arcsin(0.5)" }
    src: backend/agent/tools/math_tools/_base_evaluator.py:79-80
    lures: [calculator, math_solver]
    q: "帮我算 arcsin(0.5)"
    a: |
      函数名不对，计算器返回「未知的函数: 'arcsin'」。这个计算器里反正弦写作 `asin`，不是 `arcsin`。
    retry_args: { expression: "asin(0.5)" }
    a_retry: |
      函数名写法不一样：这个计算器里反正弦是 `asin` 不是 `arcsin`，换过来就算出来了。

      $\arcsin(0.5) = {value}$ 弧度，也就是 30°。

  - id: calc_syntax_error
    tool: calculator
    args: { expression: "2 +* 3" }
    src: backend/agent/tools/math_tools/_base_evaluator.py:120-121
    lures: [calculator, bitwise_calculator]
    q: "算一下 2 +* 3"
    a: |
      式子有语法错误（计算器返回「语法错误: invalid syntax」）：`+*` 两个运算符连在一起了。

      你是想算 `2 + 3`（等于 5）还是 `2 * 3`（等于 6）？说一声我马上算。

  - id: calc_nan
    tool: calculator
    args: { expression: "inf - inf" }
    src: backend/agent/tools/math_tools/calculator.py:154-161
    lures: [calculator, math_solver]
    q: "无穷大减无穷大等于多少，算一下 inf - inf"
    a: |
      计算器返回的是「计算结果为 NaN（非数字）」。

      这不是计算器算不动，而是 $\infty - \infty$ 本身就是**未定式**：它的值取决于两个无穷大是怎么趋近的。
      $\lim(x - x) = 0$，但 $\lim(2x - x) = \infty$，同样是「无穷减无穷」，结果完全不同。
      所以只有放进具体极限里才有答案。你有具体的式子吗？

  - id: bitwise_popcount_negative
    tool: bitwise_calculator
    args: { expression: "popcount(-3)" }
    src: backend/agent/tools/math_tools/bitwise_calculator.py:19-20
    lures: [bitwise_calculator, calculator]
    q: "算一下 -3 的二进制里有几个 1，popcount(-3)"
    a: |
      算不了，工具返回「函数 'popcount' 调用错误: popcount 仅支持非负整数，负数在任意精度下无确定补码表示」。

      原因是负数的补码位数取决于字长：-3 在 8 位下是 `11111101`（7 个 1），在 32 位下是 29 个 1。
      不指定字长就没有唯一答案。你要按几位算？给我位数，我用 `-3 & 0xFF` 这种方式先截断再数。

  - id: bitwise_syntax_error
    tool: bitwise_calculator
    args: { expression: "0xFF & 0xGG" }
    src: backend/agent/tools/math_tools/_base_evaluator.py:120-121
    lures: [bitwise_calculator, calculator]
    q: "算一下 0xFF & 0xGG"
    a: |
      `0xGG` 不是合法的十六进制（工具返回「语法错误: invalid hexadecimal literal」）——十六进制只有 0-9 和 A-F，没有 G。

      你是想写 `0xFF & 0xF0` 还是别的？把正确的数给我，我再算。

  - id: bitwise_unknown_function
    tool: bitwise_calculator
    args: { expression: "rotate(5, 1)" }
    src: backend/agent/tools/math_tools/_base_evaluator.py:79-80
    lures: [bitwise_calculator, calculator]
    q: "帮我算 rotate(5, 1)，就是循环左移一位"
    a: |
      工具里没有这个函数，返回的是「未知的函数: 'rotate'」——它只支持基本位运算和 bin/oct/hex/bit_length/popcount。

      循环左移可以用基本位运算拼出来：8 位下 `((5 << 1) | (5 >> 7)) & 0xFF`。
      不过要先确定按几位循环——8 位、16 位还是 32 位？说一声我按那个位宽算。

  - id: solver_binomial_format
    tool: math_solver
    args: { operation: binomial, expression: "5" }
    src: backend/agent/tools/math_tools/math_solver.py:236-238
    lures: [math_solver, calculator]
    q: "帮我算组合数 C(5,2)"
    retry_args: { operation: binomial, expression: "5, 2" }
    a_retry: |
      第一次参数格式写错了，工具提示组合数要写成 `'n, r'`，改过来就好了。

      $C(5,2) = {value}$。

  - id: solver_permutation_format
    tool: math_solver
    args: { operation: permutation, expression: "6" }
    src: backend/agent/tools/math_tools/math_solver.py:245-247
    lures: [math_solver, calculator]
    q: "6 个元素取 3 个的排列数是多少"
    retry_args: { operation: permutation, expression: "6, 3" }
    a_retry: |
      排列数同样要把两个数一起传进去（格式 `'n, r'`），改完算出来了。

      $A(6,3) = {value}$，也就是 $6 \times 5 \times 4$。

  - id: solver_summation_bounds
    tool: math_solver
    args: { operation: summation, expression: "i", variable: "i" }
    src: backend/agent/tools/math_tools/math_solver.py:283-284
    lures: [math_solver, calculator]
    q: "求 i 从 1 加到 n 的求和公式"
    retry_args: { operation: summation, expression: "i", variable: "i", lower: "1", upper: "n" }
    a_retry: |
      求和要把上下限一起给（第一次漏了，工具提示「求和需要 lower 和 upper 参数」），补上 1 到 n 就出来了：

      $$\sum_{{i=1}}^{{n}} i = {latex}$$

      也就是熟悉的 $\frac{{n(n+1)}}{{2}}$，展开后是同一个式子。

  - id: solver_parse_failed
    tool: math_solver
    args: { operation: diff, expression: "x^^2", variable: "x" }
    src: backend/agent/tools/math_tools/math_solver.py:97-99
    lures: [math_solver, calculator]
    q: "对 x^^2 求导"
    a: |
      表达式解析不了（工具返回「表达式解析失败: invalid syntax」）：`^^` 不是合法写法。

      幂运算写 `x**2`，或者写 `x^2` 也行。你是想对 $x^2$ 求导吗？确认一下我就算。

# ⚠️ 这里曾经有一条 solver_solve_needs_variable（solve 不带 variable → 报错 → 补上重试）。
# 已删除：`solve` 属于 MATH_SOLVER_NEEDS_VAR，schema 描述里也给了带 variable 的例子，
# 漏填就是模型的低级错误，不符合本文件第二节那条硬规矩。
# 是 validate.py 的 arg_conditional 检查把它拦下来的 —— 检查比我更守规矩，留个记录。

# ---------------------------------------------------------------------------
# ③ 空结果类 —— 调用完全正确，只是库里没有这门课
#
# 观测由 fixtures.recommend_practice 真实计算得到：ranking 为空就走
# count=0 + note 分支（mastery_tools.py:160-168，fixtures.py 逐字一致）。
# 课程名必须**确实不在知识图谱里**，否则拿到的就不是空结果了。
# ---------------------------------------------------------------------------
empty_result:
  - id: empty_course_advanced_math
    course: "高等数学"
    weeks_to_exam: 3
    lures: [recommend_practice, get_mastery_report, get_mastery_level]
    q: "高等数学还有 3 周考试，帮我排一下练习重点"
    a: |
      查了一下，知识库里没有「高等数学」这门课的知识点（工具返回 count=0，提示「{note}」）。

      我覆盖的是计算机专业课，目前有：{courses} 等。高等数学不在里面，所以我排不出基于你真实掌握度的优先级——
      硬编一份出来对你没用。

      要不我们换成上面某一门？或者你把高数的章节清单发我，我按通用方法帮你排，只是没有学情数据支撑。

  - id: empty_course_physics
    course: "大学物理"
    weeks_to_exam: 6
    lures: [recommend_practice, get_mastery_report]
    q: "距离大学物理期末还有 6 周，给我列个刷题优先级"
    a: |
      「大学物理」不在知识库里，工具返回的是空结果加一句「{note}」。

      我这边收录的是计算机专业课（{courses} 等），物理没有知识点也没有你的练习记录，
      算不出优先级。6 周时间够从容复习，你要是想让我帮忙，可以把课程大纲发我按通用方法排；
      计算机课那边我随时能给你真实学情排序。

  - id: empty_course_english
    course: "大学英语"
    weeks_to_exam: 2
    lures: [recommend_practice, get_review_timing]
    q: "大学英语两周后考，练什么好"
    a: |
      没查到「大学英语」——工具返回 count=0，提示「{note}」。

      我只覆盖计算机专业课（{courses} 等），英语这块我没有你的任何学习数据，给不了有依据的建议。
      两周后如果还有计算机的科目要考，告诉我是哪一门，我按真实掌握度帮你排。

  - id: empty_course_typo
    course: "数据结够"
    weeks_to_exam: 4
    lures: [recommend_practice, get_mastery_report]
    q: "数据结够这门课还有 4 周考试，帮我安排下练习"
    a: |
      按「数据结够」没查到东西，工具提示「{note}」。

      看着像是打字打岔了——你是指**数据结构**吧？确认一下我就按这门课重新查你的掌握度，
      给出真正基于数据的练习顺序。在你确认之前我不会自己改课程名去查，万一猜错了，
      拿到的就是别人那门课的结论。

