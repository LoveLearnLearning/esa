    # ---------------------------------------------------------------------
    # gate 未满足：只是提到，没有明确指令。
    #
    # ⚠️ 2026-08-19（第三次改这一组，见交接文档 5.23 / 5.29）。
    #
    # 前两次的错误都是同一个形状：**注释里的意图对，实现把范围扩大了**。
    # 第一版整组标成「不得动记忆」，理由写的是「防不可逆的状态修改」，
    # 而实现连只读工具一起禁；第二次只把疑问句挪走，陈述句原样留下，
    # 于是「推断出稳定信息必须 propose」这条规则在这一组里仍然是反的。
    #
    # 这一次**逐条**对着线上 system prompt 的「# 记忆使用规则」判，判据表如下
    # （原文逐字抄自 data/cache/system_prompts.json，不是凭印象）：
    #
    #   search_core_memories   「只有当前任务确实依赖用户过去的长期偏好、目标、
    #                            项目、约束…时，才调用」            → 许可
    #   propose_core_memory    「对话中推断出的长期稳定信息**必须**调用 propose
    #                            创建待确认候选」                    → **强制**
    #   get_core_memories      「只有用户明确要求查看、管理或列出全部…时」→ 违规
    #   save_core_memory       「只有用户在本轮明确要求系统记住、保存…时」→ 违规
    #   delete_core_memory     「只有用户明确要求忘掉某条…时」        → 违规
    #
    # 再加 propose 自己的 schema 描述（它比上面那条更窄，是本组的主判据）：
    #   「仅在信息可能对未来任务有持续价值时调用；
    #     **不得提交秘密、短期状态或未经依据的猜测**。」
    #
    # 于是逐条问三个问题，得到三个去处：
    #
    #   Q1 这句话给出了一个**可以直接写成记忆内容的具体稳定值**吗？
    #      （身份 / 稳定偏好 / 稳定习惯 / 长期目标 / 长期约束）
    #      → 有：`推断出稳定信息` 组，gold = 调 propose_core_memory。
    #        规则里 propose 是唯一用「必须」的一条，两条都成立时它优先。
    #   Q2 没有具体值，但**点名了一个可检索的具体主题**，且把它定位在
    #      「我跟你说过 / 你那边存的」？
    #      → 是：移到 seeds/new_tools.yaml 的 search_core_memories 正例
    #        （和 5.23 移走的那 17 条疑问句同一个去处 —— 同一句话去掉问号
    #        不该换一个标准答案）。
    #   Q3 都不是 → 留在下面三组作负样本，gold = 不调用任何工具。
    #
    # 下面三组**不是**按语气分的，是按「为什么这里不该调工具」分的，
    # 每组名字就是它的判据。分组还有第二个作用：原来 88 条挤在同一个
    # template_id 里，占了主评测集 FPR 分母的 95%（5.27），
    # 拆开之后宏平均才有意义，也才可能有一部分进训练集。

    # 讲的是这几天/最近的状态、情绪、进度。
    # 判据：propose 的描述明写「不得提交短期状态」；而「今天学不进去」
    # 也不依赖任何过去的长期信息，search 的 gate 同样不成立。
    仅提及_短期状态:
      - "我今天状态不太好，学不进去"
      - "唉，最近学习效率好低"
      - "感觉最近状态一般般"
      - "最近有点想摆烂了"
      - "这几天没怎么学，有点心虚"
      - "最近课太多了，顾不过来"
      - "这学期过半了，感觉没什么进展"
      - "最近学得有点没头绪"
      - "这几周状态起伏挺大的"
      - "感觉这学期没怎么发力"
      - "最近老是学一半就走神"
      - "现在的节奏我有点跟不上"
      - "老实说我最近有点松懈"
      - "这学期开局不太顺"
      - "最近学习的动力有点不足"
      - "这段时间被别的事占满了"
      - "最近的学习安排有点混乱"
      - "这几天有点提不起劲"
      - "现在的状态和我预想的差挺多"
      - "最近有点迷茫，不知道往哪使劲"
      - "这学期比我想像中难熬"
      - "感觉自己的节奏被打乱了"
      - "这段时间的收获比预期少"

    # 对过去定下的目标/计划/设定表示动摇、否定或想调整，
    # 但**没给出新值、没点名可检索的主题、也没要求改动**。
    # 判据：save/delete 都要求「本轮明确要求」，不成立；
    # 没有新的稳定值，propose 无从提起（提了就是「未经依据的猜测」）；
    # 「之前设的东西」「之前聊的内容」不是 schema 说的「要检索的具体主题」，
    # 拿它去 search 是漫无目的地翻库，规则明确不鼓励。
    # ⚠️ 这一组是最容易被再次标错的一组：它读起来像是在说记忆，
    # 但用户既没说新值也没说要改。正确动作是**接住话，并说明我不会自己动它**。
    仅提及_重估既有安排:
      - "我这学期目标定得有点高了"
      - "感觉我之前设的那个目标不太现实"
      - "我可能不太适合考研这条路"
      - "上次说的那个复习计划，我没怎么执行"
      - "之前那个目标现在看有点离谱"
      - "这学期计划有点赶不上变化"
      - "我可能要调整一下方向了"
      - "上次那个安排太满了，有点吃不消"
      - "现在想想当初的规划有点理想化"
      - "我可能得重新想想学习方向"
      - "感觉我之前立的 flag 都倒了"
      - "最近老想着换个学习方法"
      - "这学期的安排比我想的紧"
      - "感觉当初定的目标有点飘"
      - "有点想调整节奏了"
      - "上次定的计划我执行得很一般"
      - "我之前的方向感觉不太对劲"
      - "现在回头看，之前的规划太乐观了"
      - "当初立的目标现在看有点远"
      - "原本的安排最近全打乱了"
      - "有点想推翻重来的意思"
      - "当初想得挺美，现在有点难顶"
      - "我记性差，之前设的东西全忘了"
      - "这个方向我越学越不确定"
      - "之前那套方法用着用着就腻了"
      - "感觉目标定得太笼统了"
      - "我可能需要换个思路"
      - "当初的规划现在执行不下去了"
      - "有点想重新梳理一下自己的情况"
      - "我记性不好，之前聊的内容都模糊了"
      - "感觉需要给自己降降预期"
      - "之前设的那些条条框框现在有点束缚"
      - "最近一直在纠结要不要换方向"
      - "之前那些设定放到现在不太合适了"
      # 「想有点起色」不是可落成记忆的内容 —— propose 要求信息「对未来任务
      # 有持续价值」，这句话填不出 content，所以它不是 Q1 那一类。
      - "我记得说过我想在这学期有点起色"

    # 对自己的能力/自律/方法作模糊评价。
    # 判据：这类话给不出可写进记忆的具体值（「我不太自律」是情绪化的自评，
    # 不是稳定事实），propose 的「不得提交…未经依据的猜测」正是针对它；
    # 也没有指向任何一条已存记忆，search 的 gate 不成立。
    仅提及_泛化自评:
      - "感觉自己啥也没学会"
      - "感觉我的学习习惯这两年变了不少"
      - "我可能不太擅长这种学习方式"
