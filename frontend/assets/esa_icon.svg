<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" rx="216" fill="#1B1A19"/>

  <!-- Geometric E / knowledge-link backbone -->
  <path d="M332 292 V732
           M332 292 H658
           M332 512 H582
           M332 732 H658"
        fill="none"
        stroke="#2563EB"
        stroke-width="92"
