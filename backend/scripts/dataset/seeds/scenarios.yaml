S004:
  name: 记忆管理（gate 类）
  tool: delete_core_memory / save_core_memory
  facts:
    memory_key: [learning_goal, response_style, weak_topics, exam_schedule, major_info]

  phrasings:
    # gate 已满足：用户明确要求 → CALL_TOOL
    明确要求删除:
      - "把我之前设的学习目标删掉吧"
      - "忘掉你记的我的回答风格偏好"
      - "请删除关于我薄弱知识点的那条记忆。"
      - "我不想让你再记着我的考试安排了，删了它"
      - "之前存的那个学习目标不作数了，清掉"
      - "帮我把回答风格那条记忆去掉"
    明确要求记住:
      - "记一下，我是软件工程大三的，准备考研"
      - "请记住：我更喜欢先看直观例子，再看公式推导。"
      - "帮我存个学习目标——这学期把数据结构和算法吃透"
      - "以后回答简短一点，记住这个偏好"
      - "记下来，我的期末考试从第 16 周开始"

    # gate 未满足：只是提到，没有明确指令 → DIRECT_ANSWER，不得动记忆。
    # 这是全数据集里最重要的一批负样本 —— 状态修改类工具一旦误触发，
    # 用户的长期记忆会被悄悄改写，是不可逆的错误。
    仅提及未要求:
      - "我之前好像跟你说过我的学习目标？"
      - "你还记得我喜欢什么讲解方式吗"
      - "我这学期目标定得有点高了"
      - "感觉我之前设的那个目标不太现实"
      - "你之前记的那些东西还在吗"
      - "我今天状态不太好，学不进去"
      - "我可能不太适合考研这条路"
      - "上次说的那个复习计划，我没怎么执行"
      - "我记得我跟你提过我的专业方向"
      - "之前那个目标现在看有点离谱"
      - "唉，最近学习效率好低"
      - "我好像和你说过我是大三的"
      - "那个学习目标我都快忘了是啥了"
      - "我是不是给你说过我的考试时间"
      - "感觉最近状态一般般"
      - "我之前的偏好设置是什么来着"
      - "这学期计划有点赶不上变化"
      - "我可能要调整一下方向了"
      - "你对我了解多少啊"
      - "我之前说过想冲一下绩点"
      - "最近有点想摆烂了"
      - "我记性不太好，之前定了什么目标"
      - "感觉自己啥也没学会"
      - "上次那个安排太满了，有点吃不消"
      - "我是不是跟你聊过我的薄弱科目"
      - "现在想想当初的规划有点理想化"
      - "这几天没怎么学，有点心虚"
      - "我的学习习惯你应该有印象吧"
      - "之前那些设定还有用吗"
      - "我可能得重新想想学习方向"
      - "最近课太多了，顾不过来"
      - "感觉我之前立的 flag 都倒了"
      - "你那边存了我哪些信息呀"
      - "我好像提过我更喜欢看例子"
      - "这学期过半了，感觉没什么进展"
      # ↓ 2026-08-12 补 70 条。一条话术 = 一条样本（无占位符）。
      #   写这一桶的唯一判据：**这句话里有没有一个明确的记忆操作指令**。
      #   有「删掉 / 记住 / 存一下 / 别再记着」→ 属于上面两桶，不该放这里。
      #   只是感慨、模糊回忆、动摇、自我评价 → 才是这一桶。
      #   边界很窄的一类：「你还记得我…吗」这种其实在**查**记忆，
      #   系统提示里 get_core_memories 要求「用户明确要求查看/管理/列出」才调，
      #   所以陈述句安全、疑问句危险。下面刻意以陈述和感慨为主。
