S004:
  name: 记忆管理（gate 类）
  tool: delete_core_memory / save_core_memory
  facts:
    memory_key: [learning_goal, response_style, weak_topics, exam_schedule, major_info]

  phrasings:
    # gate 已满足：用户明确要求 → CALL_TOOL
    明确要求删除:
      - "把我之前设的学习目标删掉吧"
      - "忘掉你记的我的回答风格偏好"
      - "请删除关于我薄弱知识点的那条记忆。"
      - "我不想让你再记着我的考试安排了，删了它"
      - "之前存的那个学习目标不作数了，清掉"
      - "帮我把回答风格那条记忆去掉"
    # gate 满足：用户在本轮**明确要求**记住/保存 → save_core_memory 直接落成正式记忆。
    # 规则原文：「只有用户在本轮明确要求系统记住、保存或长期保留某项信息时，
    #             才调用 save_core_memory 直接创建正式记忆。」
    #
    # ⚠️ 2026-08-19（晚）改成 dict 形式，参数从生成器里搬回种子。
    # 原来 memory_key / content / category / known 四项写死在
    # `gen_negatives.py` 的 `SAVE_ARGS` 里，按**用户原话**当 key 查表 ——
    # 那正是 5.19 / 5.22 反复讲的「生成器替种子作者做语义决定」，
    # 而且改一个字的话术就会静默跳过那条样本（生成器只打印一行 ⚠️）。
    # propose 那一组这次是直接按新规矩写的，两边不该一个样式。
    #
    # ⚠️ `known` = 这条样本开始时记忆库里已有哪些 key，它决定走哪个分支。
    # 后端 save_explicit 有三条路（core_memory_service.py:196-234）：
    #     库里没这个 key        → status="created"
    #     有且内容分类都一样     → status="unchanged"
    #     有但内容不同          → status="confirmation_required"，**不覆盖**，产出待确认候选
    # 三种都要有样本。恒返回「存好了」等于教模型在需要确认时谎报已保存。
    #
    # ⚠️ 2026-08-19（晚）从 5 条补到 12 条。理由是 ④-3 把 propose 正例从 0 补到 24，
    # 训练文件里变成 propose 18 : save 5 —— 而**上一轮 lora 真实的违规恰恰是
    # 「未明确要求就 save」**，我们这一轮教的正是「那种情况走 propose」。
    # 反过来的错（用户明说「记一下」却去 propose）原来两套评测集都量不到。
    # 补话术是为了别把边界教偏，量得到那件事由 supplement.yaml 的 boundary 组负责。
    明确要求记住:
      - q: "记一下，我是软件工程大三的，准备考研"
        memory_key: major_info
        content: "软件工程专业大三，准备考研"
        category: profile
        known: [major_info]          # 已有「软件工程专业大三」→ 内容不同 → 待确认
      - q: "请记住：我更喜欢先看直观例子，再看公式推导。"
        memory_key: response_style
        content: "先看直观例子，再看公式推导"
        category: preference
        known: []                     # 空库 → created
      - q: "帮我存个学习目标——这学期把数据结构和算法吃透"
        memory_key: learning_goal
        content: "这学期把数据结构和算法吃透"
        category: learning
        known: []
      - q: "以后回答简短一点，记住这个偏好"
        memory_key: response_style
        content: "回答尽量简短"
        category: preference
