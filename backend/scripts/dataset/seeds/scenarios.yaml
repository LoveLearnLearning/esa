        category: constraint
      # ↓ 这一条故意撞上已存在的 learning_goal —— 后端对已有 key 会产出
      #   candidate_type="replace" 并带上 expected_revision，和上面的 "create"
      #   分支不是同一种返回值。两支都要有样本，否则模型只见过一半。
      - q: "我现在主要想把编译原理拿下来，别的先放放"
        memory_key: learning_goal
        content: "当前主要目标是拿下编译原理"
        category: learning
  ask_templates:
    memory_key:
      - "可以帮你删。请问要删掉哪一条？你目前保存的有学习目标、回答风格偏好这些。"
      - "好的，不过得先确认删哪条记忆——能说下具体是哪一项吗？"
  refuse_templates:
    # gate 未满足时的回应。**按组分开写**，不是一个池子随机取。
    #
    # 原来三句话共用一个池子，于是「唉，最近学习效率好低」有三分之一的概率
    # 收到「记忆我保留着没变，想改或者清掉明确告诉我一声」—— 用户压根没提记忆，
    # 助手却在解释自己没动记忆。这三组样本里有一部分现在会进训练集
    # （拆 template 之后不再整组落在评测集里），助手台词就是训练信号，
    # 一句答非所问的台词教出来的就是答非所问 —— 5.22 那个坑正是这么来的。
    仅提及_短期状态:
      - "这种状态挺常见的，先别急着给自己下结论。要不要挑个小一点的任务先动起来，比如二十分钟做一道题？"
      - "先别硬扛。今天实在学不进去就把强度降下来，做点低负担的复盘也算数。明天想从哪块开始，我陪你排。"
      - "状态有起伏很正常，不代表前面白学了。要我帮你看看现在哪几个知识点最值得先捡起来吗？"
    仅提及_重估既有安排:
      - "你之前设的目标我这边还留着。要调整或者删掉的话跟我说一声，我不会自己动它。"
      - "记忆我保留着没变。如果想改或者清掉，明确告诉我一声就行。"
      - "计划赶不上变化很正常。你想怎么调，说一句我就按新的来；在你说之前，之前那份我原样留着。"
    仅提及_泛化自评:
      - "这种自我评价我先不当成结论——它更像是这阵子的感受，不是你的水平。想看得准一点的话，我可以按你的练习记录给你挑几个具体的点。"
      - "先别急着贴标签。要不我们挑一个你最没底的知识点，从它开始理一遍？"
      - "「学习方式合不合适」这件事光靠感觉判断不了。你说说最近是怎么学的，我帮你看看哪一步在空转。"

