# 工具失败恢复（tool_error）种子库
#
# ══════════════════════════════════════════════════════════════════════════
# 一、这批数据要教什么
# ══════════════════════════════════════════════════════════════════════════
#
# 这个 Agent 里**同时存在三种失败表示**，模型必须都认得：
#
#   ① 抛异常被包装成字符串    "[Error]: 搜索请求超时"
#                             tool_register.call 捕获 ValueError/TypeError/RuntimeError
#                             后 `return f"[Error]: {e}"`（tool_register.py:79-80）
#
#   ② 正常返回但带 error 键    {'expression': '1024/(10-10)', 'result': None, 'error': '除零错误'}
#                             三个计算器不抛异常，失败也走正常返回
#                             （calculator.py:145-150 / bitwise_calculator.py:157-162 /
#                              math_solver.py:298-304）
#
#   ③ 正常返回但被拒绝/为空    {'allowed': False, ..., 'reason': '当前会话为 isolated 模式…'}
#                             {'count': 0, ..., 'note': "未找到课程 '高等数学' 的知识点…"}
#                             （memory_tools.py / mastery_tools.py 的阻断与空结果分支）
#
# 三种长得完全不一样，而恢复动作是同一个：**如实说明，绝不编一个结果出来**。
#
# ══════════════════════════════════════════════════════════════════════════
# 二、一条硬规矩：第一次调用必须是「换成谁都会这么调」的
# ══════════════════════════════════════════════════════════════════════════
#
# tool_error 样本里，助手发出的**每一条**消息都会算 loss —— 包括那次失败的调用。
# 所以如果第一次调用本身就是模型的低级错误（比如 required 参数漏填），
# 这条样本等于在教模型犯那个错，再教它擦屁股。净效果是负的。
#
# 因此本文件里每一条的第一次调用都必须属于下面三种之一：
#   (a) 失败源于外部世界   —— arXiv 超时、检索服务没配置
#   (b) 失败源于用户给的输入 —— 用户自己写的表达式除零 / 拼错函数名 / 带未知变量
#   (c) 失败源于 schema 没说清 —— binomial 的 expression 要写成 'n, r'，
#                                schema 描述里一个例子都没有，模型第一次写 '5' 完全合理
#
# 「用户明确要求了某个参数、照做才报错」也算 (b)：模型是在服从用户当前消息。
#
# ══════════════════════════════════════════════════════════════════════════
# 三、报错文案一律逐字取自后端，每条带 src
# ══════════════════════════════════════════════════════════════════════════
#
# validate.py 的 check_error_texts_registered 会核对：数据里出现的报错文案
# 必须在本文件登记过。这样以后没人能顺手编一句「[Error]: 服务暂时不可用」进去。
#
# 只登记**完全字面量**的报错。像 `无法连接到 arXiv API：{exc}` 这种把第三方异常
# 内插进来的，我们无法确知 {exc} 长什么样，就不做 —— 编一段 requests 的异常文本
# 和编一篇论文是同一类问题。
#
# calculators 段的观测值不写在这里，而是由 tools/capture_math_outputs.py
# 跑后端真实函数抓进 data/cache/math_real.json。本文件只登记「调什么、说什么」。

# ---------------------------------------------------------------------------
# ⑥ Agent 统一结构化错误协议
#
# 这里的 message 逐字来自 backend/agent/tools/execution_errors.py。真实异常类型、
# 堆栈和第三方详情只进 audit，不允许出现在这些模型 observation 或回答里。
# ---------------------------------------------------------------------------
structured_runtime:
  - id: web_search_timeout_after_retry
    tool: web_search
    args: { query: "2026 年知识追踪最新进展" }
    error_code: timeout
    retryable: true
    attempt: 2
    retry_after_ms: 1000
    message: "工具执行超时"
    lures: [web_search, arxiv_search, retrieve_knowledge]
    q: "帮我查一下 2026 年知识追踪最新进展"
    a: |
      网络检索在有限重试后仍然超时，本轮没有拿到可核验的新资料。我不会据此编造 2026 年的进展；
      可以稍后重试，或把范围缩小到具体模型、数据集或评测指标后再查。

  - id: arxiv_rate_limited
    tool: arxiv_search
    args: { query: "retrieval augmented generation", max_results: 5 }
    error_code: rate_limited
    retryable: true
    attempt: 2
    retry_after_ms: 1000
    message: "工具服务请求过于频繁，请稍后重试"
    lures: [arxiv_search, web_search]
    q: "查五篇最近的 RAG 论文给我"
    a: |
      arXiv 检索被限流，有限重试后仍未恢复，所以这次没有可靠的论文列表。请稍后再试；
      在检索恢复前，我可以先按你关心的方向整理检索关键词，但不会编论文标题或编号。

  - id: knowledge_network_error
    tool: retrieve_knowledge
    args: { query: "红黑树删除", top_k: 5 }
    error_code: network_error
    retryable: true
    attempt: 2
    retry_after_ms: 1000
    message: "工具网络连接暂时不可用"
    lures: [retrieve_knowledge, web_search]
    q: "从课程资料里查红黑树删除的步骤"
    a: |
      课程资料检索的网络连接暂时不可用，重试后仍没拿到原文。我可以明确标注地讲通用算法，
      但不能冒充课程资料中的版本；也可以等连接恢复后再按课件回答。

  - id: memory_permission_denied
    tool: save_core_memory
    args: { memory_key: "classmate", content: "记住别人的私人联系方式", category: "general" }
    error_code: permission_denied
    retryable: false
    attempt: 1
    message: "当前请求无权执行该工具"
    lures: [save_core_memory, propose_core_memory]
    q: "把我同学的私人联系方式存进长期记忆"
    a: |
      这个请求没有写入权限，我不会重试或绕过限制。涉及他人的私人联系方式也不适合进入长期记忆；
      如果只是要记一项不含隐私的协作偏好，可以改写成不包含联系方式的内容。

  - id: sandbox_internal_error
    tool: run_in_sandbox
    args: { command: "python analysis.py" }
    error_code: tool_internal_error
    retryable: false
    attempt: 1
    message: "工具暂时无法完成请求，请稍后重试"
    lures: [run_in_sandbox, calculator]
    q: "在沙箱里跑一下 analysis.py，把结果告诉我"
    a: |
      沙箱工具暂时无法完成请求，而且没有返回可用结果。我不会把内部异常细节或猜测的运行结果展示出来；
      请稍后重试，或者贴出关键代码和输入，我先做静态检查。

  - id: mastery_tool_budget_exhausted
    tool: get_mastery_report
    args: { course: "数据结构" }
    error_code: tool_budget_exhausted
    retryable: false
    attempt: 1
    message: "本轮工具调用预算已用完"
    lures: [get_mastery_report, get_mastery_level, recommend_practice]
    q: "把我的数据结构学情、薄弱点和复习计划全部查清楚"
    a: |
      本轮工具调用预算已经用完；我会基于前面已经取得的结果给出阶段性结论，不再继续调用工具。
      若要继续查证，请把范围缩小到一门课或一个知识点后重试。

  - id: review_duplicate_call_blocked
    tool: get_review_timing
    args: { kp_id: "Cache" }
    error_code: duplicate_call_blocked
    retryable: false
    attempt: 1
    message: "相同的失败工具调用已达到重复上限"
    lures: [get_review_timing, get_mastery_level]
    q: "继续查 Cache 的复习时间"
    a: |
      相同参数的调用已经连续失败并达到重复上限，继续原样调用不会带来新信息。
      可以检查知识点名称是否正确，或换一个更具体的问题后再试。

# ---------------------------------------------------------------------------
# ① [Error]: 包装类 —— 外部服务失败，模型无过错
# ---------------------------------------------------------------------------
wrapped:
  - id: arxiv_timeout
    raises: RuntimeError      # 抛的异常类型；闸门拿 classify_tool_exception 核
    error_code: temporary_tool_error
    tool: arxiv_search
    args: { query: "knowledge tracing", max_results: 3 }
    err: "arXiv API 请求超时（已重试 5 次）"
    src: backend/agent/tools/arxiv_search.py:295
    lures: [arxiv_search, web_search, retrieve_knowledge]
    q: "帮我找几篇知识追踪方向的论文，我想看看最近的进展"
    a: |
      arXiv 检索这次没跑通，没拿到结果。

      我不会凭印象报几个标题给你——论文的题目、作者和编号我编不得。两个选择：稍后我再检索一次，
      或者你先说说你关心知识追踪的哪一面（模型结构？数据集？评测指标？），我先把这块的基础脉络讲清楚，
      等检索通了再补具体文献。

  # ── 统一检索：已选公共库，而公共库未配置（2026-08-26，上游 c80bad7 之后）──
  # 题面原样搬自旧的 retrieve_federated_knowledge__正例 —— 那 5 条问的都是课程概念，
  # 在新设计下前端会选公共库。err 是真跑出来的，不是编的：
  #   backend/agent/rag/unified_retrieval.py:54  public_service is None → raise
  # ⚠️ 这一族教的是「没拿到证据要说出来，再用通用知识接着答」，
  #    不是「换个参数重试」—— 服务没配置，重试多少次都一样。
  - id: unified_public_unconfigured_00
    raises: RuntimeError      # 抛的异常类型；闸门拿 classify_tool_exception 核
    error_code: temporary_tool_error
    tool: retrieve_knowledge
    args: { query: "最小生成树" }
    err: "public knowledge service is not configured"
    src: backend/agent/rag/unified_retrieval.py:54
    lures: [retrieve_knowledge, get_knowledge_base_stats, web_search, load_skill]
    q: "帮我讲讲最小生成树是怎么回事"
    a: |
      知识库这次没查成，所以下面这段是按通用理解讲的，**不是从知识库查出来的**。

      最小生成树是连通无向图里「把所有点连起来、且边权总和最小」的那棵树。n 个点就用 n-1 条边，多一条必成环。

      两种标准做法：Kruskal 把边按权重从小到大排，用并查集判断加进来会不会成环；Prim 从一个点出发，每次挑「连接已选点集与未选点集」中最轻的那条边。稠密图用 Prim，稀疏图用 Kruskal。

      举个具体的：n 座城市之间铺光缆，每段造价不同，要让所有城市连通且总造价最低——这就是 MST。

      两个常见的坑：一是它只对连通图有定义，图不连通时得到的是最小生成森林；二是边权有相同值时 MST 可能不唯一，但最小总权重是唯一的。

      等库恢复了我再检索一次，把出处补上。

  - id: unified_public_unconfigured_01
    raises: RuntimeError      # 抛的异常类型；闸门拿 classify_tool_exception 核
    error_code: temporary_tool_error
    tool: retrieve_knowledge
    args: { query: "死锁的必要条件" }
    err: "public knowledge service is not configured"
    src: backend/agent/rag/unified_retrieval.py:54
    lures: [retrieve_knowledge, get_knowledge_base_stats, web_search, load_skill]
    q: "死锁的四个必要条件是什么"
    a: |
      知识库这次没查成，所以下面这段是按通用理解讲的，**不是从知识库查出来的**。

      互斥、占有并等待、不可抢占、循环等待——四个同时成立，才**可能**发生死锁。

      逐条说：互斥是资源同一时刻只能被一个进程占用；占有并等待是进程握着已有资源去申请新的；不可抢占是资源只能由持有者主动释放；循环等待是若干进程首尾相接地互相等对方的资源。

      最小的例子：进程 A 拿着锁 1 去申请锁 2，进程 B 拿着锁 2 去申请锁 1，两个都不放手，就僵住了。

      易错的地方：这四条是**必要**条件不是充分条件——四条都满足也未必真的死锁，得真的形成了那个环才算。预防死锁的思路正是破坏其中任意一条，比如按固定顺序申请资源就破坏了循环等待。

      等库恢复了我再检索一次，把出处补上。

  - id: unified_public_unconfigured_02
    raises: RuntimeError      # 抛的异常类型；闸门拿 classify_tool_exception 核
    error_code: temporary_tool_error
    tool: retrieve_knowledge
    args: { query: "TCP 拥塞控制" }
    err: "public knowledge service is not configured"
    src: backend/agent/rag/unified_retrieval.py:54
    lures: [retrieve_knowledge, get_knowledge_base_stats, web_search, load_skill]
    q: "TCP 的拥塞控制是怎么做的"
    a: |
      知识库这次没查成，所以下面这段是按通用理解讲的，**不是从知识库查出来的**。

      TCP 的拥塞控制是四个机制配合：慢启动、拥塞避免、快重传、快恢复。核心是维护一个拥塞窗口 cwnd，靠丢包当信号来猜网络还能吃多少。

      慢启动阶段 cwnd 每收到一个 ACK 就加一，实际是每轮翻倍，涨到阈值 ssthresh 后转入拥塞避免，改成每轮只加一个 MSS 的线性增长。收到三个重复 ACK 就快重传——不等超时直接补发那个包，并把 ssthresh 砍半、进入快恢复；真的超时了才认为网络很糟，cwnd 直接回到一。

      你下载文件时速度先猛冲一段再稳住，就是慢启动转拥塞避免那个拐点。

      最常混的一个点：拥塞控制看的是**网络**能承受多少（cwnd），流量控制看的是**接收方**来不来得及收（rwnd）——两件事，实际发送窗口取两者的较小值。

      等库恢复了我再检索一次，把出处补上。

  - id: unified_public_unconfigured_03
    raises: RuntimeError      # 抛的异常类型；闸门拿 classify_tool_exception 核
    error_code: temporary_tool_error
    tool: retrieve_knowledge
    args: { query: "动态规划 分治法 区别" }
    err: "public knowledge service is not configured"
    src: backend/agent/rag/unified_retrieval.py:54
    lures: [retrieve_knowledge, get_knowledge_base_stats, web_search, load_skill]
    q: "动态规划和分治法有什么区别"
    a: |
      知识库这次没查成，所以下面这段是按通用理解讲的，**不是从知识库查出来的**。

      两者都把大问题拆成子问题，区别只有一个：**子问题会不会重复出现**。

      分治的子问题互相独立，算完就扔，比如归并排序把数组一切两半，左右两半毫无关系。动态规划的子问题会被反复用到，所以必须把结果存下来——这就是记忆化或者填表。

      最直观的对比是斐波那契：递归写法里 f(n-2) 会被算很多遍，指数级；改成 DP 存起来就是线性。而归并排序即使写成递归也不会重复算，因为没有重叠。

      一个容易漏的前提：能用 DP 还要满足**最优子结构**——大问题的最优解由子问题的最优解拼出来。有重叠但没有最优子结构，DP 也不成立。

      等库恢复了我再检索一次，把出处补上。

  - id: unified_public_unconfigured_04
    raises: RuntimeError      # 抛的异常类型；闸门拿 classify_tool_exception 核
    error_code: temporary_tool_error
    tool: retrieve_knowledge
    args: { query: "虚拟内存" }
    err: "public knowledge service is not configured"
    src: backend/agent/rag/unified_retrieval.py:54
    lures: [retrieve_knowledge, get_knowledge_base_stats, web_search, load_skill]
    q: "虚拟内存到底解决了什么问题"
    a: |
      知识库这次没查成，所以下面这段是按通用理解讲的，**不是从知识库查出来的**。

      虚拟内存给每个进程一套独立的地址空间，通过页表映射到物理页，并且按需调页——用到哪页才装哪页，不够了就把冷页换出到磁盘。

      它一次解决三件事，而不只是「内存不够」：
      一是让程序能用比物理内存更大的地址空间；二是进程之间地址隔离，A 的 0x1000 和 B 的 0x1000 是不同的物理页，互相踩不到；三是物理页可以不连续，消除了外部碎片，程序也不用管自己被装在哪。

      具体点：物理内存 8GB 却能同时跑十个各自申请了 4GB 地址空间的进程，靠的就是这套映射加按需调页。

      常见的误解是把它等同于「拿硬盘当内存用」——换页只是其中一个手段，地址隔离和重定位这两件事，即使物理内存充足也一样需要它。

      等库恢复了我再检索一次，把出处补上。

  - id: arxiv_http_503
    raises: RuntimeError      # 抛的异常类型；闸门拿 classify_tool_exception 核
    error_code: temporary_tool_error
    tool: arxiv_search
    args: { query: "retrieval augmented generation", max_results: 3 }
