# 外部工具种子库：arxiv_search / get_time / web_search（get_weather 已随上游删除，见下方墓碑）
#
# 这四个和学情类工具的性质不同：它们的返回值要么来自外部世界，要么随时间变化。
# 处理原则各不相同，写在各自段落里。

# ---------------------------------------------------------------------------
# arxiv_search —— 对应赛题的「助研场景」
#
# 观测值全部来自 data/cache/arxiv_real.json，是调 arXiv 公开 API 抓的**真实论文**。
# 绝不编造：赛题《02—伦理与安全合规性声明》要求承诺「不涉及伪造学术数据、虚假文献」，
# 训练数据里编论文等于教模型编引用。
#
# query 用英文（arXiv 内容是英文），但用户问句是中文 —— 这正是要教的：
# 把中文需求翻成合适的英文检索词。
# ---------------------------------------------------------------------------
arxiv_search:
  正例:
    - zh: "帮我找几篇大模型智能体方向的论文"
      query: "large language model agent"
    - zh: "我想看看知识追踪最近的研究"
      query: "knowledge tracing"
    - zh: "有没有关于间隔重复记忆模型的文献"
      query: "spaced repetition memory model"
    - zh: "图神经网络这块有什么经典工作吗"
      query: "graph neural network"
    - zh: "帮我查一下 transformer 注意力机制的原始论文"
      query: "transformer attention"
    - zh: "智能辅导系统方向的研究现状怎么样"
      query: "intelligent tutoring system"
    - zh: "代码生成有哪些评测基准"
      query: "code generation benchmark"
    - zh: "检索增强生成相关的论文给我推荐几篇"
      query: "retrieval augmented generation"
    - zh: "RLHF 是怎么来的，有原始文献吗"
      query: "reinforcement learning from human feedback"
    - zh: "Cache 替换策略有没有比较新的研究"
      query: "cache replacement policy"
    - zh: "分布式共识 Raft 的论文帮我找一下"
      query: "distributed consensus raft"
    - zh: "数据库查询优化方向有什么值得读的"
      query: "database query optimization"
    - zh: "拥塞控制算法的研究进展"
      query: "congestion control algorithm"
    - zh: "最短路径算法有没有新的改进工作"
      query: "shortest path algorithm"
    - zh: "操作系统调度方向的论文"
      query: "operating system scheduling"
  按作者:
    - zh: "Yann LeCun 都发过什么论文"
      query: "Yann LeCun"
      search_field: author
    - zh: "帮我搜一下 Yann LeCun 的工作"
      query: "Yann LeCun"
      search_field: author

  # 课本上就有的基础概念，不该去检索前沿论文
  混淆_不该检索:
    - "什么是二叉搜索树"
    - "TCP 三次握手的过程是什么"
    - "快速排序怎么实现"
    - "帮我讲讲动态规划的基本思想"
    - "分页和分段有什么区别"

# ---------------------------------------------------------------------------
# get_time —— 需要"现在几点/今天几号"这类实时信息时调用
#
# ⚠️ 后端实现有两个已知问题（已记入待办）：返回 UTC 而学生在东八区；
#    格式用 %D（即 %m/%d/%y，美式两位年份）。这里如实复刻现状。
# ---------------------------------------------------------------------------
get_time:
  正例:
    - "现在几点了"
    - "今天是几号"
    - "帮我看下当前时间"
    - "现在是什么时候"
    - "查一下现在的日期"
  # 含"时间"二字但问的是概念 —— 这类已在 negatives.yaml 的 traps 里覆盖，
  # 这里只补几条不同角度的
  混淆_不该调:
    - "我一般什么时间学习效率高"
    - "复习时间怎么分配比较合理"
    - "刷题一般要花多长时间"

# ---------------------------------------------------------------------------
# 🪦 get_weather —— **上游 2026-08-28 `c18c84e` 把它从注册表删了**，整组已移除。
#
# 原来是 8 城 × 3 话术的正例 + 3 条缺参数追问（IR 24 条调用 / 训练池 18 条 /
# 考卷 18 道，全在 L1_同分布，**不碰 L3 那条最硬的证据**）。
#
# ⚠️ 这是**能力损失，不是清理**（5.30 的规矩：删掉判据要有人知道）：
# 「缺参数就追问」这条规律原来有一个**跨场景**的对照点 —— 天气和学习无关，
# 模型在它上面追问，说明学到的是规律不是话术。删掉之后这条规律只剩
# S002 那一族（`缺weeks` / `缺course` / `都缺`）在教，**全部在学习场景内**。
# 补充集里那道 `supp__ask__缺city`（「明天要不要带伞？」）同因删除。
#
# 别再把它加回来 —— 后端注册表里没有的工具，写进样本就是教模型调一个不存在的东西。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# web_search —— 只做**错误恢复**样本
#
# 没有真实 SearXNG 实例，就不生成"检索到了什么"的正例 —— 编造搜索结果和 URL
# 与编造论文是同一类问题。等后端能导出真实检索结果再补。
#
# 但报错文案是真的（逐字取自 backend/agent/tools/web_search.py），
# 所以错误恢复样本完全可以造，而且正好补上目前为 0 的 RECOVER_TOOL_ERROR 类。
# ---------------------------------------------------------------------------
web_search:
  正例查询:
    - zh: "查一下今年 ACM 会议的投稿截止时间"
      query: "ACM 2026 会议 投稿截止时间"
    - zh: "搜一下最近有什么大模型的新闻"
      query: "大语言模型 最新进展"
    - zh: "帮我查查考研 408 今年的大纲有没有变"
      query: "考研 408 计算机 考试大纲 变化"
    - zh: "看看有没有关于这门课的公开课资源"
      query: "数据结构 公开课 视频教程"
    - zh: "查一下 Rust 最新的稳定版本是多少"
      query: "Rust 最新稳定版本"
  恢复话术:
    - "搜索服务现在连不上（{err}）。这个问题我可以先按已有知识回答，或者你稍后再让我搜一次——你倾向哪种？"
    - "搜索没跑通：{err}。要不我先讲讲我知道的部分，等服务恢复再补实时信息？"
    - "抱歉，检索失败了（{err}），所以我拿不到最新结果。涉及时效性的部分我不能凭印象编，建议稍后重试。"
    - "搜索接口报错：{err}。我不会用猜测代替检索结果，你要是不急我们稍后再试。"
