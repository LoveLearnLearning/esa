# S001 天气：设计总表里作为「贯穿示例」存在，但它不是教育场景。
# 建议 v1 只保留少量样本用于验证「缺参数追问」这条规律的跨场景泛化（L3 场景外推），
# 不投入预算做深。
S001:
  name: 查询城市天气（仅作规律泛化的对照场景）
  tool: get_weather
  facts:
    city: [北京, 上海, 广州, 深圳, 成都, 杭州, 武汉, 西安]
  phrasings:
    参数齐全:
      - "{city}今天天气怎么样"
      - "查一下{city}的天气"
      - "请告诉我{city}当前的天气情况。"
      - "{city}现在冷不冷"
    缺city:
      - "今天天气怎么样"
      - "外面冷吗"
      - "查下天气"
      - "今天用带伞吗"
    参数在历史轮:
      - "那明天呢"
      - "现在温度多少"
  ask_templates:
    city:
      - "你想查哪个城市的天气？"
      - "请问要查询哪座城市呢？"
