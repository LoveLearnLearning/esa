# 负样本种子库：工具在场，但不该调用
#
# 当前数据里"不调用"类只占 5.9%，而目标是 23%。只训正例的后果是模型学到先验
# P(调用)≈0.94，上线后见什么都想调工具 —— 这一幕出现在评审试用 demo 时，
# 作品完成度和内容质量度会一起扣分。
#
# 三类负样本，按"我出错的风险"从低到高排：
#   A. 元对话      —— 寒暄、致谢、问系统自身。零事实风险
#   B. gate 未满足 —— 提到了但没要求。零事实风险，且防的是不可逆的记忆写入
#   C. 词面陷阱    —— 概念题撞上工具名。有事实内容，故一律写短，且复杂度断言受
#                     verified_facts.yaml 校验
#
# 每条负样本的 tool_names 里必须放进那个"诱饵工具"，否则模型根本没机会学会不调它。

# ---------------------------------------------------------------------------
# A. 元对话：完全不涉及任何工具能力
# ---------------------------------------------------------------------------
meta:
  lures: [recommend_practice, get_mastery_report, search_core_memories, get_time, record_answer]
  pairs:
    - q: "你好"
      a: "你好。我是 ESA，可以帮你规划练习、查学情、讲知识点。今天想从哪儿开始？"
    - q: "谢谢，我明白了"
      a: "不客气。还有别的想问随时说。"
    - q: "你是谁"
      a: "我是 ESA 学习辅助 Agent，面向计算机专业课，能帮你制定练习计划、诊断学情、讲解知识点。"
    - q: "你能做什么"
      a: "主要三件事：按你的掌握情况推荐该练什么、查看学情报告和复习时机、讲解具体知识点。你想试哪个？"
    - q: "在吗"
      a: "在的，你说。"
    - q: "先不聊了，我去上课"
      a: "好，回来随时找我。"
    - q: "刚才那个我没看懂"
      a: "没问题，你说下是哪一部分卡住了？我换个讲法。"
    - q: "算了，不用了"
      a: "好的。需要的时候再叫我。"
    - q: "你回答得挺好的"
      a: "谢谢。有需要继续问我就行。"
    - q: "等一下"
      a: "好，我等你。"
    - q: "你说话能简短点吗"
      a: "可以，之后我尽量精简。"
    - q: "换个话题吧"
      a: "行，你想聊什么？"

# ---------------------------------------------------------------------------
# B. gate 未满足：提到了，但没有明确指令 —— 不得调用状态修改类工具
#
# 这批是全数据集里最重要的负样本。save/delete_core_memory 和 record_* 一旦误触发，
# 用户的长期记忆会被悄悄改写，是不可逆的错误。
# ---------------------------------------------------------------------------
gate_save_memory:
  lures: [save_core_memory, get_core_memories, search_core_memories]
  pairs:
    - q: "我挺喜欢看例子的"
      a: "行，那我讲的时候多带例子。要不要我把这个偏好记下来长期生效？"
    - q: "我这学期挺忙的"
      a: "那我们把练习拆小一点，每次二十分钟。需要我把课业压力记进你的长期设定吗？"
    - q: "我是大三的"
      a: "了解。大三的话可以开始按考研或者求职的方向调整重点了。要我记住你的年级吗？"
    - q: "我觉得我数学不太好"
      a: "那涉及推导的部分我讲慢一点、多写中间步骤。需要我把这条记成长期偏好吗？"
    - q: "我一般晚上学习效率高"
      a: "那把重点内容安排在晚上比较划算。要不要我记下来，以后按这个安排？"
    - q: "我用的是 C++"
      a: "好，代码示例我就用 C++ 写。要固定成长期设定吗？"
    - q: "我不太喜欢一上来就看公式"
      a: "明白，我先给直观解释再上公式。这条要长期记住吗？"
    - q: "我们学校用的是清华版教材"
      a: "好的，我讲的时候尽量贴这个体系。需要我记下来吗？"
    - q: "我打算考研"
      a: "那我们按 408 的范围来安排。要把考研目标存成长期记忆吗？"
    - q: "最近在准备一个项目"
      a: "项目和课业一起推确实吃力。要我把这个项目背景记下来，之后安排练习时避开忙的时段吗？"

gate_delete_memory:
  lures: [delete_core_memory, get_core_memories, save_core_memory]
  pairs:
    - q: "我之前那个学习目标现在看有点不现实"
      a: "目标定高一点不算坏事，拆细一些就好。要不要一起调整？需要我改动或删掉那条记录的话，明确说一声。"
    - q: "我好像不太需要那个偏好设置了"
      a: "那条我先保留着，你确定要删的话跟我说，我不会自己动。"
    - q: "之前记的东西还准吗"
      a: "我这边存的还是原样。哪条需要更新或者清掉，你说一声我再操作。"
    - q: "我的方向可能要变了"
      a: "方向变了的话，之前的目标和重点确实该跟着调。你想好之后告诉我改成什么，我再更新记录。"
    - q: "那个考试时间我记错了"
      a: "那要更新一下吗？你给我正确的时间，我再改记录。"
    - q: "我现在不想按之前那个计划来了"
      a: "行，我们重新排。之前存的设定要不要一起改？你说了我再动。"

gate_record_answer:
  lures: [record_answer, record_learning_evidence, get_mastery_level]
  pairs:
    - q: "我等下想做几道题"
      a: "好，你说要练哪个知识点，我给你出。做完把结果告诉我，我再记录。"
    - q: "帮我出一道二叉树遍历的题"
      a: "可以。给你一棵树，写出它的中序遍历序列。做完把答案发我，我帮你看。"
    - q: "我打算今晚把死锁过一遍"
      a: "行。过完之后如果做了题，把对错告诉我，我再更新你的掌握度记录。"
    - q: "这题我还没做完"
      a: "不急，做完再说。我先不记录。"
    - q: "我想测测自己会不会哈希表"
      a: "那我出两道，你做完告诉我结果，我再记进学习记录。"
    - q: "先别记，我再想想"
      a: "好，我等你确认了再记。"
    - q: "我准备开始练动态规划了"
      a: "好。做完之后把情况告诉我，我再更新记录。"
    - q: "明天再说吧"
      a: "行，明天见。"

gate_search_memory:
  # ⚠️ 这一组最容易写错标签。原本放过「帮我算一下 2 的 10 次方」和「今天几号」，
  # 但这两句本身就该调 calculator / get_time —— 而 pick_tool_names 会随机把这些工具
  # 采样进 tool_names，于是同一句话在不同样本里给出矛盾的标准答案。
  # 这里只保留"确实任何工具都不该调"的句子。
  lures: [search_core_memories, get_core_memories]
  pairs:
    - q: "再说一遍刚才那句"
      a: "好，我重复一下刚才的内容——这个不需要去翻你的长期记忆。"
    - q: "你刚才说的第二点能展开一下吗"
      a: "可以，我就着刚才的内容展开说，不用查你的历史设定。"
    - q: "这段我抄下来了"
      a: "好。有不清楚的地方随时问。"
    - q: "我先记一下笔记"
      a: "不着急，你记完我们再继续。"

# ---------------------------------------------------------------------------
# C. 词面陷阱：概念题，但用词和某个工具名撞车
#
# 回答一律写短（两三句），只讲最核心的判别点。理由有二：
# 一是 v1 已决定不做概念讲解，二是文字越长我出事实错误的面越大。
# 涉及复杂度的断言会被 verified_facts.yaml 校验。
# ---------------------------------------------------------------------------
traps:
  - q: "快速排序的平均时间复杂度是多少"
    lure: get_time
    topic: quicksort_analysis
    a: "平均 $O(n \\log n)$，要对基准的所有可能位置取期望才推得出来。$T(n)=2T(n/2)+O(n)$ 是恰好对半分的最好情况，不能当平均情况的证明。最坏 $O(n^2)$，所以要随机化选基准。"
  - q: "二分查找的时间复杂度怎么推"
    lure: get_time
    topic: binary_search
    a: "每次把区间砍一半，最多砍 $\\log_2 n$ 次到只剩一个元素，所以是 $O(\\log n)$。"
  - q: "归并排序为什么是稳定的"
    lure: get_time
    topic: mergesort_analysis
    a: "合并时遇到相等元素优先取左半边的，相同值的相对顺序就不会变。代价是需要 $O(n)$ 的额外空间。"
  - q: "进程调度里的优先级怎么确定"
    lure: recommend_practice
    topic: 进程调度
    a: "分静态和动态两类。静态在创建时定死；动态会随运行调整——等待越久优先级越高（防饥饿），占用 CPU 越久优先级越低（偏向 I/O 密集型）。"
  - q: "优先队列和普通队列有什么区别"
    lure: recommend_practice
    topic: 优先队列
    a: "普通队列按入队顺序出队，优先队列按优先级出队，通常用堆实现，插入和删除都是 $O(\\log n)$。"
  - q: "什么是存储器层次结构"
    lure: save_core_memory
    topic: 存储器层次
    a: "把不同速度容量成本的存储器按层组织：寄存器→Cache→主存→磁盘，越靠上越快越小越贵。它成立的前提是程序有局部性，否则分层没有意义。"
  - q: "虚拟内存和 Cache 有什么区别"
    lure: save_core_memory
    topic: 虚拟内存
    a: "都是层次结构里的缓存思想，但虚拟内存由操作系统管理、以页为单位、缺页要走磁盘；Cache 由硬件管理、以块为单位、缺失只向下一级取（L2/L3 或主存），不涉及磁盘。"
  - q: "帮我回忆一下 TCP 三次握手"
    lure: get_core_memories
    topic: TCP协议
    a: "客户端发 SYN，服务端回 SYN-ACK，客户端再回 ACK。三次的必要性在于：两次握手之后服务端还不知道自己的 SYN-ACK 有没有送达，确认不了客户端的接收能力（客户端那一侧此时已经确认完了）；两次握手也挡不住滞留的历史连接请求。"
  - q: "ARP 是怎么工作的"
    lure: get_core_memories
    topic: ARP
    # 别写成「工作在网络层和链路层之间」：通用网络语境说得通，但 408 教材（谢希仁 / 王道）
    # 把 ARP 归在网络层，考试按这个判。把"看起来像 L2.5"的那层道理讲出来即可。
    a: "请求以广播发出、应答以单播返回，把 IP 地址解析成 MAC 地址，结果缓存在 ARP 表里。408 教材把它归在网络层——它为 IP 服务，但报文是直接封装进链路层帧发送的，不经过 IP。"
  - q: "二叉树的中序遍历我总写错"
    lure: record_answer
    topic: binary_tree_traversal
    a: "顺序是左→根→右，「中序」的中指的就是根在中间。前序把 visit 放最前，后序放最后，三种代码结构完全一样，只有 visit 的位置不同。"
  - q: "为什么我总是分不清分页和分段"
    lure: record_answer
    topic: 分页
    a: "关键差别是：分页大小固定、对用户透明、解决外碎片；分段长度可变、对用户可见、按逻辑模块划分。记住「页是物理的、段是逻辑的」就不容易混。"
  - q: "并查集的路径压缩是什么意思"
    lure: get_weak_prerequisites
    topic: 并查集
    a: "查找时把沿途所有节点直接挂到根上，下次查就是一步到位。配合按秩合并后，单次操作的摊还复杂度接近 $O(1)$。"
  - q: "学最短路径之前要先会什么"
    lure: get_weak_prerequisites
    topic: 最短路径
    a: "得先有图的存储和遍历基础，再理解贪心和松弛操作 —— 这两个正是 Dijkstra 的骨架。松弛没吃透，就看不懂它怎么一步步把估计值收敛成最短距离；贪心没吃透，就想不通它为什么怕负权边。"
  - q: "我什么时候会忘掉学过的东西"
    lure: get_review_timing
    topic: null
    a: "这属于记忆规律的问题：遗忘大致按指数衰减，复习间隔越拉越长效果越好。如果你想看自己某个知识点的具体复习时机，告诉我是哪个点。"
  - q: "间隔复习为什么有效"
    lure: get_review_timing
    topic: null
    a: "每次在快要忘掉时复习，提取难度大，记忆强度提升更多，稳定期也被拉长。所以间隔应该逐次变长，而不是天天重复。"
