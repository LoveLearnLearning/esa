# 三个计算器的种子库：calculator / math_solver / bitwise_calculator
#
# 这三个工具是最容易学混的一组，所以正样本和困难负样本必须成对设计：
# 每个「该调 X」都要有一个词面相似但「不该调 X」的对照。
#
# 参数由生成器程序化枚举 + 真实执行，种子库只提供「问什么」和「怎么问」。

system_prompts:
  - "你是 ESA 学习辅助 Agent，帮助计算机专业学生理解知识点。需要精确计算时调用合适的工具，能直接讲清楚的就直接回答。"
  - "你是 ESA，面向计算机专业课的学习助手。回答准确、简洁，正确使用 Markdown 和 LaTeX。只在确实需要计算时才调用工具。"
  - "你是 ESA 学习辅助 Agent。你可以根据用户需求选择工具，但不要滥用工具——能直接讲解的概念题不要调用计算器。"

# ---------------------------------------------------------------------------
# calculator：数值计算。注意此工具里 ^ 表示幂运算
# ---------------------------------------------------------------------------
calculator:
  - expr: "sqrt(144) + 2^5"
    phrasings: ["算一下 {e}", "帮我算 {e} 等于多少", "{e} = ?"]
    ctx: ""
  - expr: "log2(1024)"
    phrasings: ["{e} 是多少", "帮我算 {e}", "算法复杂度里经常出现 {e}，具体值是多少"]
    ctx: "二分查找 1024 个元素最坏要比较多少次，本质就是这个数。"
  - expr: "2^10"
    phrasings: ["{e} 等于多少", "算一下 {e}", "1KB 是 {e} 字节，帮我确认下这个数"]
    ctx: ""
  - expr: "factorial(10)"
    phrasings: ["{e} 是多少", "帮我算 {e}", "全排列 10 个元素有多少种，也就是 {e}"]
    ctx: ""
  - expr: "log2(65536)"
    phrasings: ["{e} 等于多少", "算一下 {e}"]
    ctx: "64K 大小的地址空间需要多少位地址线，就是这个数。"
  - expr: "gcd(1071, 462)"
    phrasings: ["{e} 是多少", "用欧几里得算法算 {e}", "帮我求 {e}"]
    ctx: ""
  - expr: "2^20 / 1024"
    phrasings: ["算一下 {e}", "{e} 等于多少"]
    ctx: "1MB 等于多少 KB。"
  - expr: "ceil(1000 / 64)"
    phrasings: ["{e} 是多少", "帮我算 {e}"]
    ctx: "1000 字节的数据按 64 字节一个块存，需要多少个块。"

# ---------------------------------------------------------------------------
# math_solver：符号计算。needs_var 的 operation 必须带 variable
# ---------------------------------------------------------------------------
math_solver:
  - op: "diff"
    expr: "x**3 + 2*x"
    var: "x"
    phrasings: ["求 ${e}$ 的导数", "帮我对 ${e}$ 求导", "${e}$ 关于 $x$ 的导数是什么"]
  - op: "summation"
    expr: "i"
    var: "i"
    extra: { lower: "1", upper: "n" }
    phrasings: ["求 $\\sum_{{i=1}}^{{n}} i$ 的闭式", "$1+2+\\dots+n$ 的求和公式是什么", "帮我推一下 $\\sum_{{i=1}}^{{n}} i$"]
  - op: "solve"
    expr: "x**2 - 5*x + 6"
    var: "x"
    phrasings: ["解方程 ${e} = 0$", "求 ${e} = 0$ 的根", "帮我解 ${e} = 0$"]
  - op: "expand"
    expr: "(x + 1)**3"
    var: "x"
    phrasings: ["展开 ${e}$", "把 ${e}$ 展开", "${e}$ 展开后是什么"]
  - op: "factor"
    expr: "x**2 - 1"
    var: "x"
    phrasings: ["因式分解 ${e}$", "把 ${e}$ 分解因式", "${e}$ 怎么分解"]
  - op: "limit"
    expr: "sin(x)/x"
    var: "x"
    extra: { point: "0" }
    phrasings: ["求 $\\lim_{{x \\to 0}} \\frac{{\\sin x}}{{x}}$", "${e}$ 在 $x \\to 0$ 时的极限是多少"]
  - op: "summation"
    expr: "2**i"
    var: "i"
    extra: { lower: "0", upper: "n" }
    phrasings: ["求 $\\sum_{{i=0}}^{{n}} 2^i$", "满二叉树节点数求和 $\\sum_{{i=0}}^{{n}} 2^i$ 是多少"]
  - op: "simplify"
    expr: "(x**2 - 1)/(x - 1)"
    var: "x"
    phrasings: ["化简 ${e}$", "把 ${e}$ 化简", "${e}$ 能约分吗"]

# ---------------------------------------------------------------------------
# bitwise_calculator：位运算。注意此工具里 ^ 表示异或，和 calculator 相反
# ---------------------------------------------------------------------------
bitwise_calculator:
  - expr: "0xFF & 0xAA"
    phrasings: ["{e} 等于多少", "算一下 {e}", "帮我算按位与 {e}"]
    ctx: "子网掩码运算里经常这么用。"
  - expr: "0b1010 | 0b0101"
    phrasings: ["{e} 是多少", "算一下按位或 {e}"]
    ctx: ""
  - expr: "5 ^ 3"
    phrasings: ["{e} 按位异或是多少", "算一下 5 异或 3", "{e}（异或）等于几"]
    ctx: "交换两个数的经典技巧就是连续异或三次。"
  - expr: "1 << 10"
    phrasings: ["{e} 等于多少", "算一下左移 {e}"]
    ctx: "位图里第 10 位的掩码。"
  - expr: "~0"
    phrasings: ["{e} 是多少", "补码里 {e} 等于几", "算一下 {e}"]
    ctx: "全 1 的补码表示。"
  - expr: "0xFF ^ 0xFF"
    phrasings: ["{e} 等于多少", "算一下 {e}"]
    ctx: ""
  - expr: "popcount(255)"
    phrasings: ["255 的二进制里有几个 1", "算一下 {e}", "{e} 是多少"]
    ctx: ""
  - expr: "0b1100 >> 2"
    phrasings: ["{e} 等于多少", "右移 {e} 是几"]
    ctx: ""

# ---------------------------------------------------------------------------
# 困难负样本：词面像要调工具，实际不该调
#
# 这批数据决定模型会不会"手贱乱调工具"。工具滥用是 demo 现场最容易翻车的点。
# ---------------------------------------------------------------------------
hard_negatives:
  # ⚠️ 这句话会被后端确定性路由命中 retrieve_first，Skill 正文直接注入 system prompt
  # （「讲解前先问一个很短的主动回忆问题」），并写明「按下方正文执行」。
  # 正文里那条例外（「用户只是问一个事实性短问题：不要增加摩擦」）罩不住这种带
  # 「为什么」的长讲解，所以开头必须先有一个回忆问题，否则样本在违反自己的 system prompt。
  # 同样的情况见下面的 memory_hierarchy 那条。
  - query: "快速排序的平均时间复杂度是多少，为什么是这个结果？"
    topic: quicksort_analysis
    trap: "出现「时间」「多少」，像要调 get_time 或 calculator"
    answer: |
      先不往下看，花十秒想一个问题：「平均情况」和「最好情况」用的是同一个递推式吗？想好了再对答案——这一问正是下面要澄清的地方。

      快速排序平均时间复杂度是 $O(n \log n)$。

      先说直觉：每次 partition 要扫一遍，$O(n)$ 次比较；如果每次都大致对半分，递归深度是 $O(\log n)$ 层，每层合计 $O(n)$，所以总量 $O(n \log n)$。

      不过要说清楚一点：$T(n) = 2T(n/2) + O(n)$ 是**恰好对半分**时的递推式，那是最好情况，不是平均情况的推导。平均情况要对基准的所有可能位置取期望：

      $$T(n) = n - 1 + \frac{1}{n}\sum_{i=0}^{n-1}\left(T(i) + T(n-1-i)\right)$$

      解这个递推得到 $T(n) \approx 2n\ln n \approx 1.39 n \log_2 n$，仍是 $O(n \log n)$——比最好情况多了约 39% 的比较次数。所以「平均和最好同阶」这个结论是对的，但**不能拿最好情况的式子当平均情况的证明**。

      最坏情况是 $O(n^2)$：每次选的基准都是最大或最小元素时，划分极度不平衡，递归深度退化成 $n$ 层。这也是实际实现要随机化选基准的原因。
  - query: "进程调度里的优先级是怎么确定的？"
    topic: process_scheduling
    trap: "出现「优先级」，像要调 recommend_practice（它返回优先级得分）"
    answer: |
      进程优先级的确定方式取决于调度算法，主要分两类：

      **静态优先级**——进程创建时确定，运行期间不变。依据通常是进程类型（系统进程高于用户进程）、资源需求、用户设定的 nice 值。实现简单，但容易造成低优先级进程饥饿。

      **动态优先级**——运行期间根据行为调整。常见规则有两条：
      - 等待时间越长，优先级越高（老化 aging，用来防饥饿）
      - 占用 CPU 时间越长，优先级越低（倾向于 I/O 密集型进程，提高整体响应性）

      Linux 的 CFS 严格说不用优先级队列，而是用虚拟运行时间 vruntime，每次挑 vruntime 最小的进程运行，nice 值影响 vruntime 的增长速率——本质上是同一个思路的连续化版本。
  - query: "Cache 的命中率怎么提高？"
    topic: cache_mapping
    trap: "出现「命中率」，和 get_mastery_report 的「掌握度」词面接近"
    answer: |
      提高 Cache 命中率主要从三个方向入手，对应三类缺失：

      **强制缺失（compulsory）**——首次访问必然缺失。用预取（prefetch）和增大块大小来缓解，利用空间局部性。

      **容量缺失（capacity）**——工作集超过 Cache 容量。增大容量，或者改造程序减小工作集，典型手段是循环分块（loop tiling），把大矩阵拆成能装进 Cache 的小块。

      **冲突缺失（conflict）**——多个地址映射到同一组。提高相联度（组相联替代直接映射），或者调整数据布局避免跨步访问恰好撞上同一组。

      程序层面最有效的其实是改善局部性：按行遍历行主序存储的二维数组、把结构体数组（AoS）改成数组结构体（SoA）、避免大跨步访问。
  - query: "什么是存储器层次结构？为什么要分这么多层？"
    topic: memory_hierarchy
    trap: "出现「存储/记忆」，像要调 save_core_memory 或 get_core_memories"
    answer: |
      先不往下看，试着自己答一句：分层能成立，靠的是程序的什么性质？想好了再对答案。

      存储器层次结构是把不同速度、容量、成本的存储器按层组织：寄存器 → L1/L2/L3 Cache → 主存 → SSD/磁盘。越靠上越快、越小、越贵。

      **为什么要分层**——因为速度和容量在物理上无法兼得。SRAM 快但每比特成本高、集成度低；DRAM 便宜容量大，但访问延迟比 SRAM 慢一到两个数量级；SSD 和磁盘更便宜，又比 DRAM 慢三到五个数量级。单独用任何一种都不划算。

      **为什么分层有效**——依赖程序的局部性原理：
      - 时间局部性：刚访问过的数据很可能马上再访问（循环变量）
      - 空间局部性：访问了某地址，附近地址很可能也要访问（数组遍历）

      有了局部性，绝大多数访问都能在靠上的层命中，于是整体表现接近上层的速度、接近下层的容量。这是整个层次结构成立的前提——如果程序访问完全随机，分层就没有意义了。
  - query: "帮我回忆一下 TCP 三次握手的过程。"
    topic: tcp_handshake
    trap: "出现「回忆」，像要调 get_core_memories"
    answer: |
      TCP 三次握手的过程：

      1. **SYN**：客户端发送 `SYN=1, seq=x`，进入 SYN_SENT 状态。
      2. **SYN-ACK**：服务端回 `SYN=1, ACK=1, seq=y, ack=x+1`，进入 SYN_RCVD 状态。
      3. **ACK**：客户端回 `ACK=1, seq=x+1, ack=y+1`，双方进入 ESTABLISHED。

      **为什么是三次而不是两次**——核心是要让双方都确认「自己的发送能力」和「对方的接收能力」都正常。注意缺口在服务端那一侧，不在客户端：两次握手之后客户端其实已经全部确认完了（服务端 ack 了 $x+1$，说明它收到了；自己也收到了 SYN-ACK，说明它能发）。缺的是服务端不知道自己的 SYN-ACK 有没有送达，因而确认不了客户端的接收能力。第三次 ACK 补的正是这个缺口。

      更实际的理由是防止历史连接：如果客户端一个早已超时的 SYN 在网络里滞留后才到达服务端，两次握手下服务端会直接建立连接并一直等待，浪费资源。三次握手时客户端发现这不是当前连接，会回 RST 中止。
  - query: "二叉树的中序遍历我总是写错，能讲讲吗？"
    topic: binary_tree_traversal
    trap: "出现「做错」，像要调 record_answer（但用户并没有提交答案）"
    answer: |
      中序遍历的顺序是**左 → 根 → 右**。写错通常错在递归的位置，记住这个口诀就行：中序的「中」指的是根在中间。

      ```python
      def inorder(node):
          if not node:
              return
          inorder(node.left)   # 左
          visit(node)          # 根 ← 根在中间，这就是"中序"
          inorder(node.right)  # 右
      ```

      对比一下就很清楚：前序是 `visit` 放最前（根左右），后序是 `visit` 放最后（左右根），中序是放中间。三种遍历的代码结构完全一样，只有 `visit` 的位置不同。

      一个很有用的性质：**二叉搜索树的中序遍历结果是有序的**。这也是检验 BST 是否合法的常用方法。

      你要是想练一下，可以给我一棵具体的树，我们一起走一遍——或者你先写出答案，我帮你看哪一步偏了。
