        content: "晚上的学习效率最高"
        category: preference
      - q: "我记得说过我喜欢先看整体再抠细节"
        memory_key: learning_approach
        content: "习惯先建立整体框架，再深入细节"
        category: preference
      - q: "我之前好像说过我更看重理解而不是刷量"
        memory_key: practice_philosophy
        content: "更看重理解，不追求刷题数量"
        category: preference
      - q: "我记得跟你说过我喜欢简短的回答"
        memory_key: response_length_preference
        content: "希望回答尽量简短"
        category: preference
      - q: "我好像讲过我是理论弱实践强那类"
        memory_key: strength_profile
        content: "自评理论偏弱、实践较强"
        category: learning
      # ↓ 2026-08-19 新写：不带回忆标记，用户只是顺口说出一条稳定事实。
      - q: "我是跨考的，本科不是计算机专业"
        memory_key: academic_background
        content: "跨专业报考，本科不是计算机专业"
        category: profile
      - q: "我每天只有晚上九点以后才有整块时间"
        memory_key: study_window
        content: "每天晚上九点以后才有整块学习时间"
        category: constraint
      - q: "我看文字比看视频吸收得快"
        memory_key: learning_medium_preference
        content: "看文字材料比看视频吸收更快"
        category: preference
      - q: "我打算明年春天考研"
        memory_key: exam_plan
        content: "计划明年春天考研"
        category: learning
      - q: "我英语底子比较差，专业课还行"
        memory_key: subject_strength
        content: "英语基础较弱，专业课相对稳"
        category: learning
      - q: "我平时用 Python 写作业，C++ 不太熟"
        memory_key: preferred_code_language
        content: "平时用 Python，C++ 不熟"
        category: preference
      - q: "我在准备保研，绩点比竞赛重要"
