S003:
  name: 查询掌握度报告
  tool: get_mastery_report
  facts:
    course: [数据结构, 操作系统, 计算机网络, 计算机组成原理, 数据库原理, 算法设计与分析]

  phrasings:
    # course 是 optional，缺了也直接调 → CALL_TOOL（防止把 optional 当 required）
    指定课程:
      - "我{course}学得怎么样了？"
      - "看下我{course}的掌握情况"
      - "请查询我在{course}课程的学习进度。"
      - "{course}我现在什么水平"
      - "帮我看看{course}还有哪些知识点没掌握"
      - "我想知道{course}的学情报告"
      - "{course}这门课我掌握度多少了"
      - "查一下{course}，哪些点最薄弱"
      - "{course}的学习报告给我看一下。"
      - "我{course}到底掌握得怎么样了，心里没底"
      - "帮我统计下{course}我练了多少、掌握到什么程度了"
      - "{course}我是不是有几个点一直没通"
    不指定课程:
      # 🔴 2026-08-26：原来这是一个扁平表，65 个不同问句共用**同一段 157 字**的回答
      #   （L2 形状闸门 B 抓到的最大一块）。问的根本不是一回事：
      #   「我这段时间进步了吗」问的是变化、「有多久没练」问的是陈旧，
      #   而回答一概只念那份总览报表。
      #   现在按**问的是什么**分组 —— 组名进 `c["changes"]`（同 `修改参数` 的机制），
      #   由 `_fmt_report_answer` 据此换重点。**显式声明，不靠关键词猜**
      #   （语义标签逐条写在种子里，别按组套用——这条规矩踩过一次）。
      总览:   # 要整体情况
        - "我最近学得怎么样？"
        - "看下我的学习情况"
        - "帮我查一下学情"
        - "我现在整体掌握度如何"
        - "请生成我的学习进度报告。"
        - "给我看看我的学习数据"
        - "我全部课程的掌握情况怎么样"
        - "帮我做个学情分析吧"
        - "查一下我的进度"
        - "想知道自己现在什么水平"
        - "请汇总一下我的各科掌握度。"
        - "帮我复盘一下学习情况"
        - "统计一下我的练习情况"
        - "给我一份学习总结"
        - "我这阵子学得如何"
        - "请输出我的整体学情概览。"
        - "我到底掌握了多少，说实话就行"
        - "看看我的数据吧"
        - "有没有那种一目了然的学习报告"
        - "我最近的练习成效怎么样"
        - "帮我看下哪些知识点掉队了"
        - "我的掌握度分布是什么样的"
        - "想看看自己的学习曲线"
        - "我是不是有不少知识点很久没碰了"
        - "给我个整体评估吧"
        - "我现在的水平能打几分"
        - "请汇报一下我的学习状态。"
        - "我哪些地方还欠火候"
        - "帮我照个镜子，看看学习上什么样"
        - "我的学清报告能看吗"
        - "最近练得挺多的，效果体现出来没有"
        - "我想知道自己薄弱在哪几块"
        - "总体来看我算学得好还是不好"
        - "有哪些知识点是我掌握得比较牢的"
        - "帮我盘一盘现在的情况"
        - "我的学习进度条走到哪了"
        - "看看我这段时间有没有白学"
        - "请提供我的知识点掌握明细。"
        - "我强项和弱项分别是什么"
        - "感觉学了不少，实际掌握多少呢"
        - "帮我评估下当前的学习成果"
        - "我这学期的学习数据长什么样"
        - "哪几个知识点我一直卡着"
        - "给我看看学情统计"
        - "我最近有没有进步，用数据说话"
        - "想了解一下自己的知识掌握全貌"
        - "有没有落下什么知识点"
        - "我的练习记录能总结一下吗"
        - "帮我看看整体学得扎不扎实"
        - "请生成一份我的能力诊断。"
        - "我目前的短板集中在哪"
        - "看一眼我的学习画像"
        - "这段时间学下来，我处在什么位置"
        - "我有哪些知识点还没过关"
        - "帮我核对下学习情况"
        - "我掌握得最差的是哪几个点"
        - "整体上我还有多少没搞定的"
      薄弱:   # 只问薄弱点
        - "哪些知识点我还比较弱？"
        - "我哪块最拉胯"
        - "有哪些点是我一直没搞定的"
        - "看看我还有哪些短板"
        - "我的薄弱环节在哪"
      陈旧:   # 问的是「多久没练」
        - "有多久没练的知识点吗"
      变化:   # 🔴 问的是**变化**，而 get_mastery_report 只给快照——答不了「进步了」，要如实说
        - "我这段时间进步了吗"
        - "我最近是不是有点荒废了"

