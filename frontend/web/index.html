<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    移动端视口必须在这里显式声明，不能依赖 Flutter 引擎运行时注入：
    - 引擎注入前手机浏览器按 980px 桌面视口渲染，首屏错误缩放
    - interactive-widget=resizes-content 让 Chrome Android 108+ 在软键盘
      弹出时缩小布局视口，否则输入框会被键盘盖住
    - maximum-scale=1 阻止 iOS Safari 聚焦输入框时自动放大
    - viewport-fit=cover 让刘海屏的 safe-area-inset 正确传入 SafeArea
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="google" content="notranslate">
  <meta name="description" content="星知智链智能学习助手">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#2563EB">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1B1A19">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="星知智链">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>星知智链</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /*
      Flutter paints visible text on its canvas. Browser translators and some
      accessibility extensions can override Flutter's transparent semantics
      layer and display the same labels a second time. Keep that DOM layer
      visually transparent while preserving it for assistive technologies.
    */
    flt-semantics,
    flt-semantics-placeholder {
      color: transparent !important;
      text-shadow: none !important;
      -webkit-text-fill-color: transparent !important;
    }
    /*
      移动浏览器兜底：深色背景避免弱网加载期白屏闪烁；
      overscroll-behavior 禁用 Android 下拉刷新和 iOS 橡皮筋回弹，
      避免与应用内滚动冲突；tap-highlight 去掉触摸高亮闪烁。
    */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #1B1A19;
      overscroll-behavior-y: none;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <script>
    // This site is deployed by replacing static files. Remove Flutter's old
    // offline worker before loading the app so a prior release cannot keep
    // serving a stale main.dart.js after deployment.
    (async () => {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((item) => item.unregister()));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(
          keys.filter((key) => key.startsWith('flutter-')).map((key) => caches.delete(key)),
        );
      }
      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js';
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    })();
  </script>
</body>
</html>
