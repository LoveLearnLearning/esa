    err: "arXiv API 请求超时（已重试 5 次）"
    src: backend/agent/tools/arxiv_search.py:295
    lures: [arxiv_search, web_search]
    q: "按作者搜一下 Yann LeCun 都发过什么"
    a: |
      按作者检索这次没跑通。

      作者检索这件事尤其不能靠记忆凑——把不是他的论文安到他名下，比没查到还糟。等服务恢复我再查一次，
