# 「有工具在场，但这件事根本用不上工具」——不调用类样本。
#
# 选题来源
# --------
# 架构 V1 的 Task Family 候选空间共 54 项，其中 **37 项后端没有任何工具支撑**
# （代码理解、翻译、内容改写、逻辑推理、结构化输出……见 `架构V1-评估.md` §4.2）。
# 这些方向产出的全是 DIRECT_ANSWER 样本，而"不调用类"正是我们最硬的瓶颈：
# 要扩到一万条并保持配比，还需要再手写约 2,200 条。
# 所以架构那份 Scenario 清单对我们最直接的用处，就是当负样本的**选题清单**。
#
# 为什么这些一定不该调工具（每条都过了这道关）
# ----------------------------------------------
# 交接文档 5.6 那个错误栽过**四次**：把"其实该调 B 的句子"写成了"不该调 A"的负样本。
# 所以这里统一用一个能自证的写法：
#
#   **要处理的内容由用户在问句里直接给出。**
#
# 代码贴在问句里、段落贴在问句里、待转换的表格贴在问句里 —— 没有任何东西需要去检索、
# 计算或读学情。这样"不该调工具"就不是我的判断，而是句子本身的性质。
#
# 反面例子（这些**不能**写进来）：
#   「帮我算 2^16」        → 该调 calculator
#   「搜几篇 GNN 的论文」   → 该调 arxiv_search
#   「我数据结构学得怎么样」 → 该调 get_mastery_report
#   「现在几点」            → 该调 get_time
#
# has_facts: true 的那些，回答里有需要外部知识才能判对错的技术断言，
# 按 gen_negatives.py:98 的既有约定挂人工复核；纯粹在加工用户给定内容的
# （转格式、压缩、翻译）不挂 —— 对错在问句里就能看出来。
#
# ⚠️ 措辞还要避开后端路由的触发词，否则样本会和自己的 system prompt 起冲突：
# 路由命中时后端会把某个 Skill 正文注入 prompt 并要求"按正文执行"，
# 而这批样本的正确行为是直接把活干掉，不套教学脚手架。
# 实测踩到过两个：
#   「为什么…」→ retrieve_first（CONCEPT_MARKERS）
#   「…挑**不会**的重点看」→ progressive_hint（STUCK_MARKERS 里有「不会」，很容易误踩）
# 两条都改了措辞绕开。`gen_no_tool_tasks.py` 每次生成都会重查一遍并打印，
# 新增种子时看一眼那行输出。
#
# lures = 在场的诱饵工具。不放诱饵，模型没机会学会"给了工具也别调"。

代码理解:
  lures: [retrieve_knowledge, web_search, load_skill, get_knowledge_base_stats]
  pairs:
    - q: |
        这段代码跑起来停不下来，问题出在哪？
        int i = 0;
        while (i < 10) {
            printf("%d\n", i);
        }
      a: 因为 `i` 从头到尾没变过。循环体里只打印不自增，条件 `i < 10` 永远成立。在 `printf` 后面补一句 `i++` 就行。
      has_facts: true

    - q: |
        帮我看看这个函数返回值对不对：
        def find_max(nums):
            m = 0
            for n in nums:
                if n > m: m = n
            return m
      a: 全是负数时会错。初值写成 0，而 0 比任何负数都大，`[-3,-1,-7]` 会返回 0 而不是 -1。把初值改成 `nums[0]`（并先判空），或者用 `float('-inf')`。
      has_facts: true

    - q: |
        这两行的区别是什么？
        a = [[0]*3]*3
        b = [[0]*3 for _ in range(3)]
      a: >-
        `a` 的三行是**同一个列表的三个引用**，改 `a[0][0]` 三行会一起变；
        `b` 每次循环新建一个列表，三行互相独立。要二维数组用 `b` 那种写法。
      has_facts: true

    - q: |
        帮我审一下这段，有没有隐患：
        with open(path) as f:
            data = json.load(f)
        return data["items"][0]
      a: 两个地方会炸：文件不是合法 JSON 时 `json.load` 抛 `JSONDecodeError`；`items` 不存在或是空列表时抛 `KeyError`/`IndexError`。要么用 `data.get("items", [])` 再判空，要么把这两种情况显式接住 —— 别用裸 `except` 一起吞掉，那样出错时你看不出是哪一种。
      has_facts: true

    - q: 我写的递归函数栈溢出了，一般从哪几个方向查
      a: 三个方向：一是**递归没有出口**或出口条件永远走不到；二是**每层没有真正缩小问题规模**（比如传下去的还是原参数）；三是问题规模本身就超过默认栈深（Python 默认 1000 层），这种要改成迭代或显式用栈。先打印每层的参数看它有没有在变小。
      has_facts: true

内容处理:
  lures: [retrieve_knowledge, web_search, arxiv_search, get_knowledge_base_stats]
  pairs:
    - q: |
        帮我把这段整理成表格：
        进程调度算法：FCFS，先来先服务，实现简单但平均等待时间长；SJF，短作业优先，平均等待时间最优但可能饿死长作业；RR，时间片轮转，响应快但上下文切换开销大。
      a: |
        | 算法 | 全称 | 优点 | 缺点 |
        |---|---|---|---|
        | FCFS | 先来先服务 | 实现简单 | 平均等待时间长 |
        | SJF | 短作业优先 | 平均等待时间最优 | 可能饿死长作业 |
        | RR | 时间片轮转 | 响应快 | 上下文切换开销大 |

    - q: |
        这段话太啰嗦了，帮我压到一句：
        我们在这次实验中主要做的事情是，先把原始数据做了一遍清洗，把里面重复的和缺失严重的样本去掉了，然后又对剩下的数据做了归一化处理，最后才拿去训练模型。
      a: 本次实验先清洗原始数据（去重、剔除缺失严重样本），再做归一化，最后用于模型训练。

    - q: |
        把这句翻译成中文，术语别乱翻：
        A cache miss occurs when the requested data is not present in the cache, forcing a fetch from the next level of the memory hierarchy.
      a: 当请求的数据不在缓存中时就发生缓存缺失（cache miss），此时必须从存储层次结构的下一级取回数据。

    - q: |
        把下面这几条改写得正式一点，我要放进实验报告：
        我们试了下把学习率调小，结果好像好了一点点，但也没好特别多。
      a: 我们尝试降低学习率，模型性能有小幅提升，但改善幅度有限。

    - q: |
        从这段里把待办事项挑出来：
        今天开会定了几件事，小李负责把接口文档补完，我这周要把测试用例写完，另外下周一之前要把部署脚本跑通，还聊了下上季度的情况。
      a: |
        三项待办：
        1. 小李——补完接口文档
        2. 我——本周内写完测试用例
        3. 下周一前——跑通部署脚本
        （"聊了下上季度情况"不是待办，没列进去。）

推理与判断:
  lures: [calculator, math_solver, retrieve_knowledge, recommend_practice]
  pairs:
    - q: 如果一个算法的时间复杂度是 O(n)，另一个是 O(log n)，是不是后者一定更快
      a: 不一定。复杂度描述的是**增长趋势**，不是具体耗时。n 很小的时候常数因子可能让 O(n) 那个更快，只有 n 足够大之后 O(log n) 的优势才必然显现。
      has_facts: true

    - q: 「所有的树都是图，所以所有的图都是树」这个推理错在哪
      a: 错在把蕴含关系反过来用了。「所有树都是图」只说树是图的一个子集，它的逆命题不跟着成立 —— 图里有环就不是树。这叫**换位谬误**（全称肯定命题不能直接把主谓对调）；它和「肯定后件」不是一回事，后者是「若 P 则 Q，Q 成立，故 P 成立」，要有一个具体前提才谈得上。
      has_facts: true

    - q: 死锁和活锁有什么区别，我老是搞混
      a: 死锁是**都停下来了**，各自占着对方要的资源互相等，进程状态不再变化；活锁是**都在动但没进展**，比如两个人在走廊上反复对向让路，状态一直变却谁也过不去。判断标准不是"卡住了没"，是"状态还变不变"。
      has_facts: true

    - q: 我这个问题算是并发问题还是并行问题
      a: 你还没说是什么问题，不过判据可以先给你：**并发**是多个任务交替推进，单核也能有；**并行**是多个任务同时执行，必须有多个执行单元。你把场景描述一下，我帮你归类。

方案比较:
  lures: [recommend_practice, retrieve_knowledge, web_search, get_mastery_report]
  pairs:
    - q: 数组和链表我该用哪个
      a: 看你最常做什么操作。频繁按下标随机访问、且元素数量相对稳定，用数组；频繁在中间插入删除、且很少随机访问，用链表。如果两者都要，考虑跳表或平衡树这类折中结构。
      has_facts: true

    - q: 学操作系统是先看书还是先做实验，你怎么建议
      a: 交替来最划算：先看一章建立框架，马上做对应的实验把概念落到代码上，再回头补细节。纯看书容易停在名词层面，纯做实验又容易只会调 API 不知道为什么。
      # 学习方法建议，不含需要外部知识核验的技术断言

    - q: 我想自己实现一个哈希表，大致分哪几步
      a: 四步：一、定哈希函数，把 key 映射成桶下标；二、选冲突处理方式，链地址法最好写，开放寻址法省内存；三、实现增删查；四、加扩容 —— 装填因子超过阈值（常用 0.75）就翻倍重建。建议按这个顺序写，每步都能单独测。
      has_facts: true

    - q: 复习的时候是应该按课本顺序过一遍，还是挑薄弱环节重点看
      a: 两种都有代价：按顺序过一遍不容易漏，但时间花在已经会的地方；挑着看效率高，但你对"哪里不会"的判断本身可能就是错的。折中做法是先快速过一遍目录级的自测，把真正的薄弱点定位出来，再集中攻。
