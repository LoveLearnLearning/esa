<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    移动端视口必须在这里显式声明，不能依赖 Flutter 引擎运行时注入：
    - 引擎注入前手机浏览器按 980px 桌面视口渲染，首屏错误缩放
    - interactive-widget=resizes-content 让 Chrome Android 108+ 在软键盘
      弹出时缩小布局视口，否则输入框会被键盘盖住
    - maximum-scale=1 阻止 iOS Safari 聚焦输入框时自动放大
    - viewport-fit=cover 让刘海屏的 safe-area-inset 正确传入 SafeArea
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="google" content="notranslate">
  <meta name="description" content="星知智链智能学习助手">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F2F2">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050505">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="星知智链">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="preload" href="main.dart.js" as="script">

  <title>星知智链</title>
  <link rel="manifest" href="manifest.json">
  <style>
    @font-face {
      font-family: "JetBrains Mono";
      src: url("assets/assets/fonts/JetBrainsMono-Regular.ttf") format("truetype");
      font-display: block;
      font-style: normal;
      font-weight: 400;
    }
    /*
      Flutter paints visible text on its canvas. Browser translators and some
      accessibility extensions can override Flutter's transparent semantics
      layer and display the same labels a second time. Keep that DOM layer
      visually transparent while preserving it for assistive technologies.
    */
    flt-semantics,
    flt-semantics-placeholder {
      color: transparent !important;
      text-shadow: none !important;
      -webkit-text-fill-color: transparent !important;
    }
    /* Monaco briefly enters message mode while automatic completion is empty. */
    .monaco-editor .suggest-widget.message {
      display: none !important;
    }
    /*
      移动浏览器兜底：深色背景避免弱网加载期白屏闪烁；
      overscroll-behavior 禁用 Android 下拉刷新和 iOS 橡皮筋回弹，
      避免与应用内滚动冲突；tap-highlight 去掉触摸高亮闪烁。
    */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #050505;
      overscroll-behavior-y: none;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      background: #050505;
      color: #F8FAFC;
      transition: opacity 160ms ease;
    }
    #app-loading.is-ready {
      opacity: 0;
      pointer-events: none;
    }
    #app-loading img {
      width: 56px;
      height: 56px;
    }
    #app-loading strong {
      display: block;
      margin-top: 14px;
      font: 600 18px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
      text-align: center;
    }
    #app-loading span {
      display: block;
      width: 22px;
      height: 22px;
      margin: 18px auto 0;
      border: 2px solid rgba(248, 250, 252, 0.24);
      border-top-color: #D8D8DD;
      border-radius: 50%;
      animation: app-loading-spin 700ms linear infinite;
    }
    @keyframes app-loading-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-loading { transition: none; }
      #app-loading span { animation-duration: 1400ms; }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-label="星知智链正在启动">
    <div>
      <img src="icons/Icon-192.png" alt="">
      <strong>星知智链</strong>
      <span aria-hidden="true"></span>
    </div>
  </div>
  <script>
    const cleanupUrl = new URL(window.location.href);
    if (cleanupUrl.searchParams.has('__esa_cleanup')) {
      cleanupUrl.searchParams.delete('__esa_cleanup');
      window.history.replaceState(null, '', cleanupUrl.href);
    }

    // Replace releases that used Flutter's old offline worker with ESA's
    // network-only cleanup worker. It calls skipWaiting(), removes Flutter
    // caches and reloads tabs that were still showing a cached application.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register(
        'flutter_service_worker.js?v=esa-web-cleanup-20260905-1',
        { scope: './', updateViaCache: 'none' },
      ).then(async (registration) => {
        await registration.update();
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(
            keys.filter((key) => key.startsWith('flutter-')).map((key) => caches.delete(key)),
          );
        }
      }).catch(() => {
        // Service worker cleanup is best-effort. The hashed Flutter entrypoint
        // below still allows the app to start if registration is unavailable.
      });
    } else if ('caches' in window) {
      caches.keys().then((keys) => {
        for (const key of keys) {
          if (key.startsWith('flutter-')) caches.delete(key);
        }
      });
    }
  </script>
  <script src="esa_lsp_client.js?v=lsp-client-20260814-3"></script>
  <script src="esa_monaco.js?v=keyboard-focus-20260815-2"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
