      - "我可能没有自己以为的那么自律"

    # ---------------------------------------------------------------------
    # gate 满足的第三种：用户没要求保存，但话里带出了一条长期稳定信息。
    # 线上规则对这一类用的是「**必须**」，是「# 记忆使用规则」里唯一的强制项：
    #   「对话中推断出的长期稳定信息必须调用 propose_core_memory 创建待确认候选，
    #     绝不能通过 save_core_memory 直接落成正式记忆。」
    #
    # 所以它既是 propose 的正例，也是 save 的**负例** —— 两个工具都在场，
    # 考的就是这条边界。2026-08-19 之前 propose 的正例是 **0 条**
    # （全语料一次调用都没有），而「未明确要求就 save」正是微调后真违规的主体。
    #
    # ⚠️ 语义参数（memory_key / content / category）**逐条写在这里**，
    # 不许生成器去猜 —— 5.19 / 5.22 都是「生成器替种子作者做语义决定」栽的。
    # content 只能写用户这一轮真的说了的东西；多写一个字就是替用户编记忆。
    # category 取 schema 的枚举：profile / preference / learning / project /
    # constraint / general。
    #
    # 前 12 条是从 `仅提及未要求` 里按 Q1 判出来的（原话一字未改）；
    # 后 12 条是新写的 —— 只有前 12 条的话，每条都带「我好像说过」这种回忆口气，
    # 模型会学成「听见『我说过』就 propose」，而规则说的是「推断出稳定信息就 propose」。
    # 新写的这批不带回忆标记，用户只是顺口说出一条稳定事实。
    推断出稳定信息:
      - q: "我好像和你说过我是大三的"
        memory_key: grade_level
        content: "目前大三在读"
        category: profile
      - q: "我之前说过想冲一下绩点"
        memory_key: gpa_goal
        content: "希望把绩点提上去"
        category: learning
      - q: "我好像提过我更喜欢看例子"
