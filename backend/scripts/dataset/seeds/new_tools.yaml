# 6 个新增工具的种子库
#
# get_mastery_level / get_weak_prerequisites / get_review_timing /
# record_learning_evidence / get_learning_evidence_summary / search_core_memories
#
# 重点不在正例，而在**混淆对**。这 6 个工具和已有工具语义高度接近，
# 模型最可能学错的是边界而不是调用本身。每组正例都必须配一个词面相似、
# 但正确答案是别的工具（或不调用）的对照。
#
# 另外，这批 schema 的描述里写了大量明确的门槛，逐条落成负样本：
#   search_core_memories        「不要在每轮对话开始时例行调用」
#   record_learning_evidence    「只有在学生已经实际作答/复述/尝试后才调用，不得凭空生成证据」
#   record_learning_evidence.self_confidence 「学生没有提供时不要猜测、不要传」
#   record_learning_evidence.error_type      「只有确有错误证据时填写」
#   record_learning_evidence.misconception   「不要写泛泛的"粗心"」
#   get_learning_evidence_summary 「只有制定教学策略或学习诊断时才调用」
#   get_review_timing           「用于学习计划和间隔复习，而不是替代掌握度」
#
# kp_id 用知识图谱的中文 canonical id（core_courses.yaml）。

kp_pool:
  数据结构: [二叉树遍历, 哈希表, 最小生成树, 图的遍历, 排序算法, 二叉搜索树, 并查集, 堆]
  操作系统: [进程调度, 死锁, 页面置换算法, 虚拟内存, 信号量, 分页]
  计算机网络: [TCP协议, 拥塞控制, 子网划分, 路由算法, ARP]
  算法设计与分析: [动态规划, 贪心算法, 分治法, 回溯法, 最短路径]
  计算机组成原理: [Cache, 存储器层次, 原码反码补码, 寻址方式]

# ---------------------------------------------------------------------------
# get_mastery_level —— 单个知识点的掌握度
# 对照：get_mastery_report（整体/整门课）
# ---------------------------------------------------------------------------
get_mastery_level:
  正例:
    - "我{kp}掌握得怎么样了"
    - "查一下我{kp}这个点的掌握度"
    - "{kp}我练过几次了？"
    - "我在{kp}上是什么水平"
    - "请查询我{kp}的掌握情况。"
    - "{kp}这块我到底会不会啊"
    - "看下{kp}我的练习统计"
    - "我{kp}还需要再练吗"
  混淆_应调get_mastery_report:
    # 问的是整体，不是单点
    - "我整体学得怎么样"
    - "我数据结构这门课掌握得如何"
    - "把我所有科目的掌握度列一下"
    - "我哪些知识点最弱"

# ---------------------------------------------------------------------------
# get_weak_prerequisites —— 追溯某个知识点的薄弱前置
# 对照：recommend_practice（整门课的优先级排序）
# ---------------------------------------------------------------------------
get_weak_prerequisites:
  正例:
    - "我{kp}老是学不会，是不是前面哪里没打好基础"
    - "学{kp}之前我还缺什么前置知识"
    - "{kp}的前置我掌握得怎么样"
    - "直接练{kp}行吗，还是得先补前面的"
    - "请分析我学习{kp}的前置知识薄弱环节。"
    - "{kp}我怎么都理解不了，是不是基础没打牢"
    - "看下{kp}依赖的那些知识点我会不会"
    - "我想学{kp}，但感觉基础不够，帮我查查"
  混淆_应调recommend_practice:
    # 问的是"这门课该练什么"，不是"某个点的前置是什么"
    - "数据结构我该从哪开始练"
    - "给我排个操作系统的练习优先级"
    - "这门课我先练哪个知识点比较好"

# ---------------------------------------------------------------------------
# get_review_timing —— 回忆概率 + 推荐复习日期（间隔复习）
# 对照：get_mastery_level（掌握度）—— schema 明确写了"而不是替代掌握度"
# ---------------------------------------------------------------------------
get_review_timing:
  正例:
    - "{kp}我什么时候该复习一遍"
    - "{kp}我是不是快忘了"
    - "帮我看看{kp}还需要多久复习"
    - "{kp}现在还记得住吗，要不要再过一遍"
    - "请预测我对{kp}的记忆保持情况。"
    - "{kp}上次练完到现在，我还剩多少"
    - "什么时候安排{kp}的复习比较合适"
    - "{kp}的复习日期给我算一下"
  混淆_应调get_mastery_level:
    # 问"会不会"是掌握度，不是"记不记得住"
    - "我{kp}掌握到什么程度了"
    - "{kp}我算学会了吗"
    - "我{kp}的正确率是多少"

# ---------------------------------------------------------------------------
# record_learning_evidence —— 真实且可评价的学习表现统一写入入口
# ---------------------------------------------------------------------------
# ⚠️ 2026-08-15：这一段的每条话术现在都自带参数。
#
# 原来参数是**按组**写死在生成器的 `EVIDENCE_GROUPS` 里的
# （比如 `正例_transfer` 全组 `correct: False`），而组内几条话术说的根本不是一回事：
# 「今天试了个新题型没做出来」和「勉强做对了」被打上同一个 correct=False。
# 这个错误以前看不见 —— budget 截断让每组只有第一条话术进得了数据，
# 直到 2026-08-15 生成器改成按话术轮流取，10 条样本当场被 answer_polarity 抓出来。
#
# **凡是语义标签，一律从种子里读，不在生成器里猜。**
# 生成器能程序化决定的是"参数怎么填进 JSON"，不是"学生到底做对没做对、
# 用了几级提示、有多少把握"。
record_learning_evidence:
  正例_teach_back:
    - q: "我把{kp}给同学讲了一遍，讲得还算顺，中间卡了一下"
      activity_type: teach_back
      explanation_score: 0.7
      independent: true
    - q: "我试着复述了{kp}，大概能说清楚七成"
      activity_type: teach_back
      explanation_score: 0.7
      independent: true
    - q: "刚给室友讲{kp}，发现自己有个地方说不明白"
      # "有个地方说不明白" → 解释质量明显低于上面两条，不能照抄 0.7
      activity_type: teach_back
      explanation_score: 0.5
      independent: true
  正例_hint:
    - q: "{kp}这题我看了两次提示才做出来"
      # "两次提示" → hint_level 2，不是全组统一的 3
      activity_type: hint
      hint_level: 2
      correct: true
      independent: false
    - q: "我做{kp}的时候提示用了三级，最后才做对"
      activity_type: hint
      hint_level: 3
      correct: true
      independent: false
    - q: "{kp}那道题我自己没做出来，看了答案才懂"
      # 看了答案 = 提示等级拉满且**没做对**。原来这条被打成 correct=true。
      activity_type: hint
      hint_level: 5
      correct: false
      independent: false
  正例_transfer:
    - q: "{kp}换个场景我就不会用了，今天试了个新题型没做出来"
      activity_type: transfer
      transfer_score: 0.2
      correct: false
    - q: "我把{kp}用到一个没见过的题上，勉强做对了"
      # 做对了就是 correct=true。原来这条被打成 false —— 用户说对的，数据教成错的。
      activity_type: transfer
      transfer_score: 0.6
      correct: true
  正例_带自评信心:
    # 学生**明确表达**了信心，才可以传 self_confidence；数值照他说的填，不要归一成一个值
    - q: "{kp}这题我做对了，但说实话我只有五成把握"
      activity_type: practice
      correct: true
      self_confidence: 0.5
    - q: "我{kp}答对了，感觉挺有信心的，大概九成吧"
      activity_type: practice
      correct: true
      self_confidence: 0.9
    - q: "{kp}蒙对的，其实我一点把握都没有"
      # 蒙对了：结果是对的，信心接近 0 —— 这一对反差正是这条样本的价值
      activity_type: practice
      correct: true
      self_confidence: 0.1
  正例_带错误类型:
    # 有明确错误证据，才可以填 error_type；类型照他描述的填，别整组共用一个
    - q: "{kp}我又做错了，是把概念理解反了"
      activity_type: practice
      correct: false
      error_type: conceptual
      misconception: "把最坏情况当成平均情况"
    - q: "做{kp}的时候步骤记错了顺序"
      # 步骤顺序错 = procedural，不是 conceptual
      activity_type: practice
      correct: false
      error_type: procedural
      misconception: "把算法步骤的先后顺序记反了"
    - q: "{kp}这题我是漏看了条件，不是不会"
      # 学生自己说了"不是不会"，那就不是概念错，是 careless。
      # misconception 按 schema 要求写具体的，不写"粗心"两个字。
      activity_type: practice
      correct: false
      error_type: careless
      misconception: "读题时漏掉了题干给出的限制条件"

  # ⚠️ 这组改过两次名，先后是：
  #   `混淆_应调record_answer` → `混淆_已弃用record_answer` → `正例_practice`
  # 第一次翻面（2026-08-19）：后端把 record_answer 标成「已弃用，新流程必须用
  # record_learning_evidence」，于是原判据「只有对错 → record_answer」变成在教模型
  # 调一个线上明写不得调用的工具；正解改掉，record_answer 退到**诱饵**位。
  # 第二次（2026-08-24，上游改的，我们 08-25 采纳）：后端把 record_answer 从注册表
  # **整个删掉**了，诱饵不复存在 —— 这组就此从「词面像但已弃用」的边界题
  # 退化成普通正例。**这是能力损失，不是清理**：那条边界现在没有题在考了。
  # `correct` / `activity_type` 仍必须逐条显式写出来 —— 生成器曾把 correct 写死成
  # True，「答错了」的 gold 也成了 correct=True，等于教模型把错的记成对的。
  正例_practice:
    - q: "{kp}这题我做对了"
      activity_type: practice
      correct: true
    - q: "刚做完{kp}的练习，答错了"
      activity_type: practice
      correct: false
    - q: "{kp}那道选择题我选的 B，答案是 C"
      activity_type: practice
      correct: false

  # ── gate 未满足：还没实际作答，不得凭空记录 ──
  gate未满足_未实际作答:
    - "我准备开始练{kp}了"
    - "等下我想做几道{kp}的题"
    - "{kp}这块我打算今晚复习"
    - "帮我出一道{kp}的题吧"
    - "我想测测自己{kp}会不会"
    - "{kp}的练习我还没开始做"
    - "明天我打算把{kp}过一遍"
    - "先别记，我还没做呢"

# ---------------------------------------------------------------------------
# get_learning_evidence_summary —— 学习证据摘要
# gate：只有制定教学策略或学习诊断时才调用
# ---------------------------------------------------------------------------
get_learning_evidence_summary:
  正例:
    - "帮我诊断一下我最近的学习状态有什么问题"
    - "我最近是不是太依赖提示了"
    - "分析下我近期的学习证据，看看该怎么调整策略"
    - "我独立完成的比例高不高"
    - "请汇总我最近的学习过程数据用于诊断。"
    - "我常犯的错误是哪一类"
    - "看下我{kp}最近的学习表现摘要"
    - "我这段时间的解释能力和迁移能力怎么样"
  混淆_应调get_mastery_report:
    - "我掌握度平均多少"
    - "我最弱的三个知识点是什么"

# ---------------------------------------------------------------------------
# search_core_memories —— 按需检索长期记忆
# 对照：get_core_memories（列出全部）
# gate：不要在每轮对话开始时例行调用
# ---------------------------------------------------------------------------
search_core_memories:
  # ⚠️ `query` 是**必填**的，不能省。
  #
  # 2026-08-15 之前这里只有问句，生成器拿**知识点名**去当检索词
  # （`{"query": kp}`）。实测真实检索（core_memory_retrieval.py 纯词法）：
  # 29 个知识点名里 23 个搜出空，6 个是字符二元组巧合误命中
  # （"ARP" 命中 learning_goal，是因为 "learning" 里有 "ar"）。
  # 也就是说那 48 条样本教的是「拿知识点名去翻记忆库」——
  # 一个线上几乎必然落空的动作，而观测是编的、还永远非空。
  #
  # 现在 query 由种子作者显式写出：用户问的是"我的偏好/我的目标"，
  # 就该拿这些词去搜，而不是拿讲解主题去搜。
  # **命中与否不由种子决定**——由 capture 跑真实检索定，
  # 落在 data/cache/memory_real.json 的 search_matrix 里。
  # 目前这 6 条真实结果是 3 命中 3 落空，落空的那三条正好用来教
  # 「工具没返回东西时不编，如实说并追问」。
  正例:
    - q: "按我之前说的偏好来讲{kp}"
      query: "偏好"
    - q: "还记得我的学习目标吗，按那个给我建议"
      query: "学习目标"
    - q: "我之前提过我的专业方向，结合那个说说{kp}怎么学"
      query: "专业"
    - q: "用我习惯的方式讲一下{kp}"
      query: "讲解方式"
    - q: "我之前说过我哪块弱，针对那个给我出题"
      query: "薄弱"
    - q: "按我之前定的考试时间安排一下复习"
      query: "期末"
    # ↓ 2026-08-17 从 scenarios.yaml 的 S004__仅提及未要求 移来（见交接文档 5.22）。
    #   那一组注释自己写着「疑问句其实在查记忆、危险」，而第一批 35 条
    #   写在该规则确立之前，混进了 17 条疑问句 —— 陈述句仍留在负样本里。
    - q: "我之前好像跟你说过我的学习目标？"
      query: "学习目标"
    - q: "你还记得我喜欢什么讲解方式吗"
      query: "讲解方式"
    - q: "那个学习目标我都快忘了是啥了"
      query: "学习目标"
    - q: "我是不是给你说过我的考试时间"
      query: "期末"
    - q: "我之前的偏好设置是什么来着"
      query: "偏好"
    - q: "我记性不太好，之前定了什么目标"
      query: "学习目标"
    - q: "我是不是跟你聊过我的薄弱科目"
      query: "薄弱"
    - q: "我的学习习惯你应该有印象吧"
      query: "学习习惯"
    - q: "我是不是讲过我入门比别人晚"
      query: "入门"
    - q: "我是不是提过我更吃例子那一套"
      query: "讲解方式"
    - q: "我之前是不是提过我怕数学"
      query: "薄弱"
    - q: "我好像提到过我在准备什么考试"
      query: "期末"
    # ↓ 2026-08-19 从 scenarios.yaml 的 S004 移来（第三次改那一组，见交接文档 5.29）。
    #   5.23 只移走了疑问句，留下的陈述句里还有这五条：它们**点名了一个可检索的
    #   具体主题**，并且把它定位在「我跟你说过」，也就是当前任务确实依赖过去的
    #   长期信息 —— search 的 gate 原文就是这么写的。
    #   同一句话去掉问号不该换一个标准答案，所以它们和那 17 条疑问句同一个去处。
    #   ⚠️ 「时间安排」「作息」是**新增的检索词**，必须重跑 capture_memory_tools.py
    #   把它们抓进 search_matrix；命中与否由真实检索定，不在这里编。
    - q: "我记得我跟你提过我的专业方向"
      query: "专业"
    - q: "我好像跟你讲过我想走哪个方向"
      query: "专业"
    - q: "之前说的那些偏好，我自己都记不清了"
      query: "偏好"
    - q: "我记得跟你聊过我的时间安排"
      query: "时间安排"
    - q: "我好像和你提过我的作息"
      query: "作息"
  混淆_应调get_core_memories:
    # 要的是"全部列出来"，不是"检索相关的"
    - "你都记住了我哪些事"
    - "把我保存的核心记忆全列出来"
    - "看看你那边存了我什么信息"
    # ↓ 2026-08-17 从 S004__仅提及未要求 移来。线上规则：「用户明确要求查看、管理或列出全部长期记忆时」才调 get_core_memories。
    - "你之前记的那些东西还在吗"
    - "你对我了解多少啊"
    - "之前那些设定还有用吗"
    - "你那边存了我哪些信息呀"
    - "我之前记录的那些还准吗"

# ---------------------------------------------------------------------------
# 2026-08-22 上游新增的三个工具（`b40a4e3` / `885029d`）。
#
# ⚠️ 能力边界（交接文档〇之四有详解，动手前先读）：
#   两个检索工具**只能产出降级/不可用状态**的样本 —— 我们没有 RAG 服务，
#   `data/cache/` 里也没有检索结果缓存。成功返回**不许编**：
#   fixtures.py 抬头记着上一次编结构的后果（220 条样本消费线上不存在的字段，
#   而所有校验全绿），《02》也承诺了不伪造。
#   所以这批教的是「什么时候调哪个」和「失败了怎么办」，
#   教不了「拿到检索结果之后怎么说」—— 这条要写进报告局限。
#
#   `run_in_sandbox` 不同：它的返回封装是纯函数，而命令输出只要**与环境无关**
#   就可以本机真跑一次。所以 stdout / exit_code **逐条写在种子里，且都是真跑出来的**，
#   生成器只负责套封装。⚠️ 别往里填没跑过的输出。
#
# 🔴 2026-08-26 上游 c80bad7「统一 retrive 工具，将路由机制硬编码，由用户在
#   对话框选择」之后，**只剩一个检索工具**：
#     retrieve_knowledge  「按本轮已选公共/个人知识库范围检索回答证据。」
#   `knowledge_sources` 由前端放进**可信执行上下文**，不在模型可见 parameters 里
#   （已核对：模型只看得见 query / top_k / similarity_threshold）。
#   **所以模型不再选库** —— 「只查我上传的资料」这类话不再对应另一个工具，
#   照样调 retrieve_knowledge 就是对的。这一族现在教的正是这件事。
#
#   两种能真跑出来的形态（都不是编的，见 fixtures.retrieve_knowledge 的 docstring）：
#     已选个人库 + 服务不可用 → 返回降级载荷        ← 本文件这一族
#     已选公共库 + 服务未配置 → raise RuntimeError  ← seeds/tool_errors.yaml 的 wrapped 组
# ---------------------------------------------------------------------------

retrieve_knowledge:
  # 用户把范围说死了（「我传上去的那份」）——**不要去找一个个人库专用工具**，
  # 范围是前端选的，模型照常发 query 就行。80269 在这里被训成调
  # retrieve_personal_knowledge，而那个工具已经不存在了。
  # ⚠️ query 逐条显式写出，不拿知识点名顶替（同 search_core_memories 那条规矩）
  正例:
    - q: "就在我传上去的那份讲义里找找看怎么讲最小生成树的"
      query: "最小生成树"
    - q: "只查我自己上传的资料，看看有没有讲哈希表的"
      query: "哈希表"
    - q: "我传的那个 PDF 里关于死锁是怎么说的"
      query: "死锁"
    - q: "我上传的那份笔记里怎么讲哈希冲突的"
      query: "哈希冲突"
    - q: "查一下我上传的资料里有没有提到二叉搜索树"
      query: "二叉搜索树"
  # ⚠️ 「课程概念 → 已选公共库」这一支**在这里产不出来**：
  #    unified_retrieval.py:54 对 public 且无服务是 `raise`，不是降级载荷。
  #    那一支归 seeds/tool_errors.yaml 的 `wrapped` 组（5 条，原
  #    retrieve_federated_knowledge__正例 的题面原样搬过去）。

run_in_sandbox:
  # ⚠️ stdout / exit_code 都是 2026-08-22 本机真跑出来的，命令刻意选与环境无关的。
  #    要加新条目就先跑一遍再写，别照猜。
  正例:
    - q: "帮我算一下 1 加到 100 是多少，用代码跑一遍"
      command: "python3 -c \"print(sum(range(1, 101)))\""
      stdout: "5050\n"
      exit_code: 0
    - q: "48 和 180 的最大公约数是多少，跑个代码验证下"
      command: "python3 -c \"import math; print(math.gcd(48, 180))\""
      stdout: "12\n"
      exit_code: 0
    - q: "把 [3,1,2] 排个序，用 Python 跑给我看"
      command: "python3 -c \"print(sorted([3,1,2]))\""
      stdout: "[1, 2, 3]\n"
      exit_code: 0
  # 失败态用**后端自己产生**的 `sandbox_disabled`（`sandbox.py:128`），
  # 不用「命令退出码非 0」。
  # ⚠️ 为什么不用后者：那种失败里 stderr 是**命令自己的输出**，不是后端报错文案，
  #    而标了 is_error 就会触发 `check_error_texts_registered` 要求登记 —— 登记一条
  #    不是后端产生的字符串是错的。而且 `ok:false` 会被 `check_unmarked_failures`
  #    判成「工具失败了却当成功往下说」。两道闸门都对，是我们那条样本的形态不对。
  #    真要教「命令跑失败了怎么办」，得先想清楚它算不算 tool_error 类，别硬塞。
  正例_沙箱未启用:
    - q: "帮我把这段排序代码跑一下看看输出"
      command: "python3 -c \"print(sorted([3,1,2]))\""
      disabled: true
