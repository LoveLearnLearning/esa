# 6 个新增工具的种子库
#
# get_mastery_level / get_weak_prerequisites / get_review_timing /
# record_learning_evidence / get_learning_evidence_summary / search_core_memories
#
# 重点不在正例，而在**混淆对**。这 6 个工具和已有工具语义高度接近，
# 模型最可能学错的是边界而不是调用本身。每组正例都必须配一个词面相似、
# 但正确答案是别的工具（或不调用）的对照。
#
# 另外，这批 schema 的描述里写了大量明确的门槛，逐条落成负样本：
#   search_core_memories        「不要在每轮对话开始时例行调用」
#   record_learning_evidence    「只有在学生已经实际作答/复述/尝试后才调用，不得凭空生成证据」
#   record_learning_evidence.self_confidence 「学生没有提供时不要猜测、不要传」
#   record_learning_evidence.error_type      「只有确有错误证据时填写」
#   record_learning_evidence.misconception   「不要写泛泛的"粗心"」
#   get_learning_evidence_summary 「只有制定教学策略或学习诊断时才调用」
#   get_review_timing           「用于学习计划和间隔复习，而不是替代掌握度」
#
# kp_id 用知识图谱的中文 canonical id（core_courses.yaml）。

kp_pool:
  数据结构: [二叉树遍历, 哈希表, 最小生成树, 图的遍历, 排序算法, 二叉搜索树, 并查集, 堆]
  操作系统: [进程调度, 死锁, 页面置换算法, 虚拟内存, 信号量, 分页]
  计算机网络: [TCP协议, 拥塞控制, 子网划分, 路由算法, ARP]
  算法设计与分析: [动态规划, 贪心算法, 分治法, 回溯法, 最短路径]
  计算机组成原理: [Cache, 存储器层次, 原码反码补码, 寻址方式]

# ---------------------------------------------------------------------------
# get_mastery_level —— 单个知识点的掌握度
# 对照：get_mastery_report（整体/整门课）
# ---------------------------------------------------------------------------
get_mastery_level:
  正例:
    - "我{kp}掌握得怎么样了"
    - "查一下我{kp}这个点的掌握度"
    - "{kp}我练过几次了？"
    - "我在{kp}上是什么水平"
    - "请查询我{kp}的掌握情况。"
    - "{kp}这块我到底会不会啊"
    - "看下{kp}我的练习统计"
    - "我{kp}还需要再练吗"
  混淆_应调get_mastery_report:
    # 问的是整体，不是单点
    - "我整体学得怎么样"
    - "我数据结构这门课掌握得如何"
    - "把我所有科目的掌握度列一下"
    - "我哪些知识点最弱"

# ---------------------------------------------------------------------------
# get_weak_prerequisites —— 追溯某个知识点的薄弱前置
# 对照：recommend_practice（整门课的优先级排序）
# ---------------------------------------------------------------------------
get_weak_prerequisites:
  正例:
    - "我{kp}老是学不会，是不是前面哪里没打好基础"
    - "学{kp}之前我还缺什么前置知识"
    - "{kp}的前置我掌握得怎么样"
    - "直接练{kp}行吗，还是得先补前面的"
    - "请分析我学习{kp}的前置知识薄弱环节。"
    - "{kp}我怎么都理解不了，是不是基础没打牢"
    - "看下{kp}依赖的那些知识点我会不会"
    - "我想学{kp}，但感觉基础不够，帮我查查"
  混淆_应调recommend_practice:
    # 问的是"这门课该练什么"，不是"某个点的前置是什么"
    - "数据结构我该从哪开始练"
    - "给我排个操作系统的练习优先级"
    - "这门课我先练哪个知识点比较好"

# ---------------------------------------------------------------------------
# get_review_timing —— 回忆概率 + 推荐复习日期（间隔复习）
# 对照：get_mastery_level（掌握度）—— schema 明确写了"而不是替代掌握度"
# ---------------------------------------------------------------------------
get_review_timing:
  正例:
    - "{kp}我什么时候该复习一遍"
    - "{kp}我是不是快忘了"
    - "帮我看看{kp}还需要多久复习"
    - "{kp}现在还记得住吗，要不要再过一遍"
    - "请预测我对{kp}的记忆保持情况。"
    - "{kp}上次练完到现在，我还剩多少"
    - "什么时候安排{kp}的复习比较合适"
    - "{kp}的复习日期给我算一下"
  混淆_应调get_mastery_level:
    # 问"会不会"是掌握度，不是"记不记得住"
    - "我{kp}掌握到什么程度了"
    - "{kp}我算学会了吗"
    - "我{kp}的正确率是多少"

# ---------------------------------------------------------------------------
# record_learning_evidence —— 记录学习过程证据
# 对照：record_answer（只记对错并更新掌握度）
#
# 判别点：只有对错 → record_answer；
#         涉及独立完成/提示等级/自评信心/复述/迁移/错误类型 → record_learning_evidence
# ---------------------------------------------------------------------------
record_learning_evidence:
  正例_teach_back:
    - "我把{kp}给同学讲了一遍，讲得还算顺，中间卡了一下"
    - "我试着复述了{kp}，大概能说清楚七成"
    - "刚给室友讲{kp}，发现自己有个地方说不明白"
  正例_hint:
    - "{kp}这题我看了两次提示才做出来"
    - "我做{kp}的时候提示用了三级，最后才做对"
    - "{kp}那道题我自己没做出来，看了答案才懂"
  正例_transfer:
    - "{kp}换个场景我就不会用了，今天试了个新题型没做出来"
    - "我把{kp}用到一个没见过的题上，勉强做对了"
  正例_带自评信心:
    # 学生**明确表达**了信心，才可以传 self_confidence
    - "{kp}这题我做对了，但说实话我只有五成把握"
    - "我{kp}答对了，感觉挺有信心的，大概九成吧"
    - "{kp}蒙对的，其实我一点把握都没有"
  正例_带错误类型:
    # 有明确错误证据，才可以填 error_type
    - "{kp}我又做错了，是把概念理解反了"
    - "做{kp}的时候步骤记错了顺序"
    - "{kp}这题我是漏看了条件，不是不会"

  混淆_应调record_answer:
    # 只有对错，没有过程信息 → record_answer 更合适。
    #
    # ⚠️ `correct` **必须在这里显式写出来，不能让生成器去猜**。
    # 之前这三条是纯字符串，生成器里 CONFUSION_ARGS 把 correct 写死成 True，
    # 于是「答错了」和「我选 B、答案是 C」两条的 gold 都成了 correct=True ——
    # 用户说错了，数据教模型记成对的。这是最恶劣的一类错误：
    # 结构全合法、schema 全通过、所有校验都是绿的，只有语义是反的。
    - q: "{kp}这题我做对了"
      correct: true
    - q: "刚做完{kp}的练习，答错了"
      correct: false
    - q: "{kp}那道选择题我选的 B，答案是 C"
      correct: false

  # ── gate 未满足：还没实际作答，不得凭空记录 ──
  gate未满足_未实际作答:
    - "我准备开始练{kp}了"
    - "等下我想做几道{kp}的题"
    - "{kp}这块我打算今晚复习"
    - "帮我出一道{kp}的题吧"
    - "我想测测自己{kp}会不会"
    - "{kp}的练习我还没开始做"
    - "明天我打算把{kp}过一遍"
    - "先别记，我还没做呢"

# ---------------------------------------------------------------------------
# get_learning_evidence_summary —— 学习证据摘要
# gate：只有制定教学策略或学习诊断时才调用
# ---------------------------------------------------------------------------
get_learning_evidence_summary:
  正例:
    - "帮我诊断一下我最近的学习状态有什么问题"
    - "我最近是不是太依赖提示了"
    - "分析下我近期的学习证据，看看该怎么调整策略"
    - "我独立完成的比例高不高"
    - "请汇总我最近的学习过程数据用于诊断。"
    - "我常犯的错误是哪一类"
    - "看下我{kp}最近的学习表现摘要"
    - "我这段时间的解释能力和迁移能力怎么样"
  混淆_应调get_mastery_report:
    - "我掌握度平均多少"
    - "我最弱的三个知识点是什么"

# ---------------------------------------------------------------------------
# search_core_memories —— 按需检索长期记忆
# 对照：get_core_memories（列出全部）
# gate：不要在每轮对话开始时例行调用
# ---------------------------------------------------------------------------
search_core_memories:
  正例:
    - "按我之前说的偏好来讲{kp}"
    - "还记得我的学习目标吗，按那个给我建议"
    - "我之前提过我的专业方向，结合那个说说{kp}怎么学"
    - "用我习惯的方式讲一下{kp}"
    - "我之前说过我哪块弱，针对那个给我出题"
    - "按我之前定的考试时间安排一下复习"
  混淆_应调get_core_memories:
    # 要的是"全部列出来"，不是"检索相关的"
    - "你都记住了我哪些事"
    - "把我保存的核心记忆全列出来"
    - "看看你那边存了我什么信息"
